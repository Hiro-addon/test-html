<body>
<div id="app">

<header>
<h1>MC Pack Editor Test</h1>
<button id="fileButton">ファイルを開く</button>
<input id="fileInput" type="file" accept=".mcaddon,.mcpack,.zip">
</header>

<main>

<section id="left">
<div class="panel-title">ファイル構成</div>

</div>
</section>

<div id="editorHeader">
<div id="currentFile">ファイルを選択してください</div>
<button id="saveButton" disabled>保存</button>
<button id="exportFileButton" disabled>書き出し</button>

</div>

<script>
let zip=null;
let files={};
let currentPath=null;
let addonDetected=false;
let packRoots=[];
let openFolders=new Set();
let rootOpen=true;

let imageState={
scale:1,
x:0,
y:0
};

let pointers=new Map();
let pinchStartDistance=0;
let pinchStartScale=1;

const fileInput=document.getElementById("fileInput");
const fileButton=document.getElementById("fileButton");
const tree=document.getElementById("tree");
const textEditor=document.getElementById("textEditor");
const imageEditor=document.getElementById("imageEditor");
const previewImage=document.getElementById("previewImage");
const imageViewport=document.getElementById("imageViewport");
const imageZoom=document.getElementById("imageZoom");
const currentFile=document.getElementById("currentFile");
const saveButton=document.getElementById("saveButton");
const exportFileButton=document.getElementById("exportFileButton");
const mcpackButton=document.getElementById("mcpackButton");
const zipButton=document.getElementById("zipButton");
const status=document.getElementById("status");

function normalizePath(path){
return path
.replace(/\\/g,"/")
.replace(/^\/+/,"")
.replace(/\/+/g,"/")
.replace(/^\.\//,"");
}

function isText(path){
return /\.(json|js|mcfunction|lang|txt|md|html|css|xml|yml|yaml)$/i.test(path);
}

function isImage(path){
return /\.(png|jpg|jpeg|webp|gif)$/i.test(path);
}

function isManifest(path){
return path.toLowerCase().endsWith("manifest.json");
}

function isAllowedFile(path){
const p=normalizePath(path);

if(
p.includes("/__MACOSX/") ||
p.startsWith("__MACOSX/") ||
p.endsWith("/.DS_Store") ||
p===".DS_Store" ||
p.endsWith("/Thumbs.db") ||
p==="Thumbs.db"
)return false;

if(/\.(bak|tmp|log)$/i.test(p))return false;

return isText(p)||isImage(p);
}

function getIcon(path,isFolder=false){
if(isFolder)return "📁";

if(isImage(path))return "🖼️";

if(path.toLowerCase().endsWith(".json"))return "📋";
if(path.toLowerCase().endsWith(".js"))return "📜";
if(path.toLowerCase().endsWith(".mcfunction"))return "⚙️";
if(path.toLowerCase().endsWith(".lang"))return "🌐";
if(path.toLowerCase().endsWith(".html"))return "🌐";
if(path.toLowerCase().endsWith(".css"))return "🎨";

return "📄";
}

async function detectMinecraftAddon(){
addonDetected=false;
packRoots=[];

const manifests=[];

for(const path of Object.keys(files)){
if(!isManifest(path))continue;

try{
const text=await files[path].async("string");
const data=JSON.parse(text);

if(
data &&
typeof data==="object" &&
data.header &&
typeof data.header==="object" &&
Array.isArray(data.modules) &&
(data.header.name!==undefined || data.header.uuid!==undefined)
){
let hasResources=false;
let hasData=false;

for(const module of data.modules){
if(!module||typeof module!=="object")continue;

if(module.type==="resources"){
hasResources=true;
}

if(module.type==="data"){
hasData=true;
}
}

const manifestDir=path.split("/").slice(0,-1).join("/");

manifests.push({
path,
root:manifestDir,
type:hasResources?"RP":hasData?"BP":"UNKNOWN",
data
});
}
}catch(e){}
}

const valid=manifests.filter(x=>x.type==="RP"||x.type==="BP");

for(const item of valid){
if(!packRoots.includes(item.root)){
packRoots.push(item.root);
}
}

packRoots=sortPackRoots(packRoots);

addonDetected=packRoots.length>0;

mcpackButton.disabled=!addonDetected;
}

function getPackRoot(path){
path=normalizePath(path);

for(const root of packRoots){
if(path===root||path.startsWith(root+"/")){
return root;
}
}

return null;
}

function sortPackRoots(list){
return [...list].sort((a,b)=>{
const da=a.split("/").length;
const db=b.split("/").length;

if(da!==db)return da-db;

return a.localeCompare(b);
});
}

function getRelativePath(path,root){
if(path===root)return "";
if(path.startsWith(root+"/")){
return path.slice(root.length+1);
}
return path;
}

function getTreeItems(root){
const result=[];

const prefix=root?root+"/":"";

for(const path of Object.keys(files)){
if(root){
if(path===root)continue;
if(!path.startsWith(prefix))continue;
}else{
if(packRoots.some(r=>path===r||path.startsWith(r+"/")))continue;
}

const relative=root?getRelativePath(path,root):path;

if(!relative)continue;

const parts=relative.split("/");

let current="";
let parentLevel=0;

for(let i=0;i<parts.length;i++){
const part=parts[i];

if(!part)continue;

const currentPath=current?current+"/"+part:part;

const isLast=i===parts.length-1;

const actualPath=root?root+"/"+currentPath:currentPath;

if(isLast){
if(isAllowedFile(actualPath)){
result.push({
path:actualPath,
name:part,
folder:false,
depth:parentLevel
});
}
}else{
const folderActualPath=actualPath;

const exists=result.some(x=>x.folder&&x.path===folderActualPath);

if(!exists){
result.push({
path:folderActualPath,
name:part,
folder:true,
depth:parentLevel
});
}

parentLevel++;
}

current=currentPath;
}
}

const unique=new Map();

for(const item of result){
unique.set(item.path,item);
}

return [...unique.values()].sort((a,b)=>{
if(a.depth!==b.depth){
return a.depth-b.depth;
}

if(a.folder!==b.folder){
return a.folder?-1:1;
}

return a.name.localeCompare(b.name);
});
}

function renderTree(){
tree.innerHTML="";

if(!zip){
tree.innerHTML='<div class="tree-empty">mcaddon / mcpack / zip を開いてください</div>';
return;
}

const groups=[];

for(const root of packRoots){
groups.push({
root,
name:root.split("/").pop()||root,
addon:true
});
}

const outsidePaths=[];

for(const path of Object.keys(files)){
if(packRoots.some(r=>path===r||path.startsWith(r+"/")))continue;
if(!isAllowedFile(path))continue;

outsidePaths.push(path);
}

const outsideRoots=new Set();

for(const path of outsidePaths){
const first=path.split("/")[0];

if(first){
outsideRoots.add(first);
}
}

for(const root of outsideRoots){
groups.push({
root:null,
name:root,
addon:false,
outsideRoot:root
});
}

if(groups.length===0){
tree.innerHTML='<div class="tree-empty">表示できるファイルがありません</div>';
return;
}

for(const group of groups){

if(group.addon){

const rootPath=group.root;
const isOpen=openFolders.has(rootPath);

const rootButton=document.createElement("button");
rootButton.className="tree-row root-row";
rootButton.style.paddingLeft="8px";

rootButton.innerHTML=
'<span class="tree-arrow">'+(isOpen?"▼":"▶")+'</span>'+
'<span class="tree-icon">📁</span>'+
'<span class="tree-name">'+escapeHtml(group.name)+'</span>';

rootButton.onclick=()=>{
if(openFolders.has(rootPath)){
openFolders.delete(rootPath);
}else{
openFolders.add(rootPath);
}
renderTree();
};

tree.appendChild(rootButton);

if(!isOpen)continue;

const items=getTreeItems(rootPath);

for(const item of items){

if(item.folder){

const isFolderOpen=openFolders.has(item.path);

const row=document.createElement("button");
row.className="tree-row tree-folder";

const indent=(item.depth+1)*22;

row.style.paddingLeft=(8+indent)+"px";

row.innerHTML=
'<span class="tree-arrow">'+(isFolderOpen?"▼":"▶")+'</span>'+
'<span class="tree-icon">📁</span>'+
'<span class="tree-name">'+escapeHtml(item.name)+'</span>';

row.onclick=()=>{
if(openFolders.has(item.path)){
openFolders.delete(item.path);
}else{
openFolders.add(item.path);
}
renderTree();
};

tree.appendChild(row);

}else{

const row=document.createElement("button");
row.className="tree-row tree-file";

const indent=(item.depth+1)*22;

row.style.paddingLeft=(8+indent)+"px";

row.innerHTML=
'<span class="tree-arrow"></span>'+
'<span class="tree-icon">'+getIcon(item.path)+'</span>'+
'<span class="tree-name">'+escapeHtml(item.name)+'</span>';

row.onclick=()=>{
openFile(item.path);
};

tree.appendChild(row);
}
}

}else{

const rootPath=group.outsideRoot;

const isOpen=openFolders.has(rootPath);

const rootButton=document.createElement("button");
rootButton.className="tree-row root-row";
rootButton.style.paddingLeft="8px";

rootButton.innerHTML=
'<span class="tree-arrow">'+(isOpen?"▼":"▶")+'</span>'+
'<span class="tree-icon">📁</span>'+
'<span class="tree-name">'+escapeHtml(group.name)+'</span>';

rootButton.onclick=()=>{
if(openFolders.has(rootPath)){
openFolders.delete(rootPath);
}else{
openFolders.add(rootPath);
}
renderTree();
};

tree.appendChild(rootButton);

if(!isOpen)continue;

const items=getTreeItems(null).filter(item=>{
return item.path===rootPath||item.path.startsWith(rootPath+"/");
});

for(const item of items){

const relative=item.path===rootPath?"":item.path.slice(rootPath.length+1);

if(!relative)continue;

const parts=relative.split("/");

const depth=parts.length-1;

if(item.folder){

const isFolderOpen=openFolders.has(item.path);

const row=document.createElement("button");
row.className="tree-row tree-folder";

row.style.paddingLeft=(8+(depth+1)*22)+"px";

row.innerHTML=
'<span class="tree-arrow">'+(isFolderOpen?"▼":"▶")+'</span>'+
'<span class="tree-icon">📁</span>'+
'<span class="tree-name">'+escapeHtml(item.name)+'</span>';

row.onclick=()=>{
if(openFolders.has(item.path)){
openFolders.delete(item.path);
}else{
openFolders.add(item.path);
}
renderTree();
};

tree.appendChild(row);

}else{

const row=document.createElement("button");
row.className="tree-row tree-file";

row.style.paddingLeft=(8+(depth+1)*22)+"px";

row.innerHTML=
'<span class="tree-arrow"></span>'+
'<span class="tree-icon">'+getIcon(item.path)+'</span>'+
'<span class="tree-name">'+escapeHtml(item.name)+'</span>';

row.onclick=()=>{
openFile(item.path);
};

tree.appendChild(row);
}
}
}
}
}

function escapeHtml(str){
return String(str)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

function applyImageTransform(){
previewImage.style.transform=
"translate(-50%,-50%) translate("+imageState.x+"px,"+imageState.y+"px) scale("+imageState.scale+")";

imageZoom.textContent=Math.round(imageState.scale*100)+"%";
}

function resetImage(){
imageState={
scale:1,
x:0,
y:0
};

applyImageTransform();
}

function setupImageGestures(){
imageViewport.onpointerdown=e=>{
e.preventDefault();

imageViewport.setPointerCapture(e.pointerId);

pointers.set(e.pointerId,{
x:e.clientX,
y:e.clientY
});

if(pointers.size===2){

const pts=[...pointers.values()];

pinchStartDistance=Math.hypot(
pts[0].x-pts[1].x,
pts[0].y-pts[1].y
);

pinchStartScale=imageState.scale;
}
};

imageViewport.onpointermove=e=>{
if(!pointers.has(e.pointerId))return;

pointers.set(e.pointerId,{
x:e.clientX,
y:e.clientY
});

if(pointers.size===1){

const point=pointers.get(e.pointerId);

if(!imageViewport._lastPoint){
imageViewport._lastPoint={
x:point.x,
y:point.y
};
return;
}

const dx=point.x-imageViewport._lastPoint.x;
const dy=point.y-imageViewport._lastPoint.y;

imageState.x+=dx;
imageState.y+=dy;

imageViewport._lastPoint={
x:point.x,
y:point.y
};

applyImageTransform();

}else if(pointers.size===2){

const pts=[...pointers.values()];

const distance=Math.hypot(
pts[0].x-pts[1].x,
pts[0].y-pts[1].y
);

if(pinchStartDistance>0){

let newScale=pinchStartScale*(distance/pinchStartDistance);

newScale=Math.max(.1,Math.min(8,newScale));

imageState.scale=newScale;

applyImageTransform();
}
}
};

imageViewport.onpointerup=e=>{
pointers.delete(e.pointerId);
imageViewport._lastPoint=null;

if(pointers.size<2){
pinchStartDistance=0;
}

};

imageViewport.onpointercancel=e=>{
pointers.delete(e.pointerId);
imageViewport._lastPoint=null;
};
}

async function openFile(path){
currentPath=path;

currentFile.textContent=path;

saveButton.disabled=false;
exportFileButton.disabled=false;

textEditor.style.display="none";
imageEditor.style.display="none";

const entry=files[path];

if(!entry){
return;
}

if(isImage(path)){

imageEditor.style.display="block";

const blob=await entry.async("blob");
const url=URL.createObjectURL(blob);

previewImage.onload=()=>{
URL.revokeObjectURL(url);
};

previewImage.src=url;

resetImage();

}else if(isText(path)){

textEditor.style.display="block";

try{
textEditor.value=await entry.async("string");
}catch(e){
textEditor.value="";
}

}else{

saveButton.disabled=true;
exportFileButton.disabled=true;
}

status.textContent=path;
}

fileButton.onclick=()=>{
fileInput.click();
};

fileInput.onchange=async()=>{
const file=fileInput.files[0];

if(!file)return;

status.textContent="読み込み中…";

try{

zip=await JSZip.loadAsync(file);

files={};

for(const [path,entry] of Object.entries(zip.files)){

const normalized=normalizePath(path);

if(!normalized)continue;

if(entry.dir)continue;

if(!isAllowedFile(normalized))continue;

files[normalized]=entry;
}

currentPath=null;
openFolders=new Set();

await detectMinecraftAddon();

renderTree();

currentFile.textContent="ファイルを選択してください";

textEditor.style.display="none";
imageEditor.style.display="none";

saveButton.disabled=true;
exportFileButton.disabled=true;
zipButton.disabled=false;

status.textContent=
"読み込み完了："+Object.keys(files).length+" ファイル";

}catch(e){

zip=null;
files={};
addonDetected=false;
packRoots=[];

renderTree();

mcpackButton.disabled=true;
zipButton.disabled=true;

status.textContent="読み込みに失敗しました";
}

fileInput.value="";
};

saveButton.onclick=async()=>{
if(!currentPath)return;
if(!isText(currentPath))return;

const value=textEditor.value;

files[currentPath]=new JSZip().file(
currentPath,
value
);

status.textContent="保存しました："+currentPath;
};

exportFileButton.onclick=async()=>{
if(!currentPath||!files[currentPath])return;

let blob;

if(isText(currentPath)){
blob=new Blob(
[textEditor.value],
{type:"text/plain;charset=utf-8"}
);
}else{
blob=await files[currentPath].async("blob");
}

downloadBlob(blob,currentPath.split("/").pop());

status.textContent="書き出しました："+currentPath;
};

function createCleanZip(){
const out=new JSZip();

for(const [path,entry] of Object.entries(files)){

if(!isAllowedFile(path))continue;

if(path===currentPath&&isText(path)){
out.file(path,textEditor.value);
}else{
out.file(path,entry.async("uint8array"));
}
}

return out;
}

async function exportZip(extension){
if(!zip)return;

status.textContent="書き出し中…";

try{

const out=createCleanZip();

const blob=await out.generateAsync({
type:"blob",
compression:"DEFLATE",
compressionOptions:{
level:6
}
});

downloadBlob(
blob,
"edited_pack."+extension
);

status.textContent="書き出しました";

}catch(e){

status.textContent="書き出しに失敗しました";
}
}

mcpackButton.onclick=async()=>{
if(!addonDetected)return;

const extension=packRoots.length>1?"mcaddon":"mcpack";

await exportZip(extension);
};

zipButton.onclick=async()=>{
await exportZip("zip");
};

function downloadBlob(blob,name){
const url=URL.createObjectURL(blob);

const a=document.createElement("a");
a.href=url;
a.download=name;

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);
}

document.getElementById("zoomOut").onclick=()=>{
imageState.scale=Math.max(
.1,
imageState.scale/1.2
);

applyImageTransform();
};

document.getElementById("zoomIn").onclick=()=>{
imageState.scale=Math.min(
8,
imageState.scale*1.2
);

applyImageTransform();
};

document.getElementById("resetImage").onclick=()=>{
resetImage();
};

setupImageGestures();
</script>
