<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>MC Pack Editor Test</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
padding:0;
}

body{
background:#111;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
font-family:inherit;
}

.container{
max-width:1000px;
margin:auto;
padding:24px 16px 50px;
}

h1{
margin:0 0 8px;
font-size:28px;
}

.subtitle{
color:#888;
margin-bottom:24px;
}

.section{
background:#1a1a1a;
border:1px solid #292929;
border-radius:14px;
padding:18px;
margin-bottom:16px;
}

.section h2{
margin:0 0 16px;
font-size:18px;
}

.upload{
border:1px dashed #444;
border-radius:12px;
padding:22px;
text-align:center;
background:#111;
}

.file-input{
display:none;
}

.upload-button{
display:inline-block;
padding:13px 20px;
border-radius:10px;
background:#fff;
color:#111;
font-weight:bold;
cursor:pointer;
}

.file-name{
margin-top:12px;
color:#888;
font-size:13px;
word-break:break-all;
}

.editor-layout{
display:grid;
grid-template-columns:320px 1fr;
gap:16px;
}

.file-tree,
.editor-panel{
background:#0d0d0d;
border:1px solid #292929;
border-radius:12px;
overflow:hidden;
}

.file-tree-title,
.editor-panel-title{
padding:13px 14px;
border-bottom:1px solid #292929;
font-weight:bold;
}

.file-tree-title{
display:flex;
align-items:center;
gap:8px;
min-width:0;
overflow:hidden;
}

.file-tree-title>span{
flex-shrink:0;
}

.tree-content{
padding:8px;
}

.tree-item{
display:block;
width:100%;
padding:10px;
margin:2px 0;
border:0;
border-radius:8px;
background:transparent;
color:#fff;
text-align:left;
font-size:14px;
cursor:pointer;
}

.tree-item:hover{
background:#1c1c1c;
}

.folder{
font-weight:700;
}

.file{
font-weight:400;
}

.tree-arrow{
display:inline-block;
width:18px;
font-size:12px;
color:#aaa;
}

.tree-indent-1{
padding-left:30px;
}

.tree-indent-2{
padding-left:54px;
}

.tree-indent-3{
padding-left:78px;
}

.tree-indent-4{
padding-left:102px;
}

.tree-indent-5{
padding-left:126px;
}

.tree-hidden{
display:none;
}

.file-tree,
.tree-item{
user-select:none;
-webkit-user-select:none;
-webkit-touch-callout:none;
}

.selected-file{
background:#252525;
}

.selected-folder{
background:#252525;
}

.move-panel{
display:none;
padding:10px 8px;
border-top:1px solid #292929;
animation:filePop .18s ease;
}

.move-panel.visible{
display:block;
}

.move-panel-text{
font-size:12px;
color:#aaa;
margin-bottom:8px;
word-break:break-all;
}

.move-panel-buttons{
display:grid;
grid-template-columns:1fr 1fr;
gap:6px;
}

.move-panel-buttons button{
padding:8px 5px;
border:1px solid #444;
border-radius:8px;
background:#1a1a1a;
color:#fff;
font-size:12px;
cursor:pointer;
}

.move-panel-buttons button:hover{
background:#252525;
}

.move-panel-buttons .move-confirm{
background:#fff;
color:#111;
border-color:#fff;
}

@keyframes filePop{
from{
opacity:0;
transform:translateY(-5px);
}
to{
opacity:1;
transform:translateY(0);
}
}

.tree-tools{
display:flex;
gap:6px;
align-items:center;
min-width:0;
overflow-x:auto;
overflow-y:hidden;
flex:1;
padding-bottom:1px;
scrollbar-width:none;
}

.tree-tools::-webkit-scrollbar{
display:none;
}

.tree-tools button{
flex:0 0 auto;
padding:6px 8px;
border:1px solid #444;
border-radius:7px;
background:#1a1a1a;
color:#fff;
font-size:11px;
cursor:pointer;
white-space:nowrap;
}

.tree-tools button:hover{
background:#252525;
}

.tree-tools button:disabled{
opacity:.4;
cursor:not-allowed;
}

.editor-path{
display:block;
margin-top:4px;
color:#777;
font-size:11px;
font-weight:normal;
word-break:break-all;
}

.editor-content{
min-height:420px;
}

.editor-empty{
min-height:420px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
color:#777;
}

textarea{
display:block;
width:100%;
height:520px;
resize:vertical;
border:0;
outline:none;
padding:15px;
background:#080808;
color:#ddd;
font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
font-size:13px;
line-height:1.6;
}

.image-area{
height:520px;
background:#080808;
display:flex;
flex-direction:column;
overflow:hidden;
}

.image-toolbar{
height:54px;
flex-shrink:0;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
padding:8px;
border-bottom:1px solid #292929;
background:#101010;
z-index:5;
}

.image-toolbar button{
min-width:44px;
height:38px;
padding:0 12px;
border:1px solid #444;
border-radius:8px;
background:#1a1a1a;
color:#fff;
font-size:18px;
cursor:pointer;
}

.image-toolbar button:hover{
background:#252525;
}

.zoom-value{
min-width:65px;
text-align:center;
color:#aaa;
font-size:12px;
}

.image-canvas{
position:relative;
flex:1;
overflow:hidden;
touch-action:none;
user-select:none;
-webkit-user-select:none;
background:
linear-gradient(45deg,#171717 25%,transparent 25%),
linear-gradient(-45deg,#171717 25%,transparent 25%),
linear-gradient(45deg,transparent 75%,#171717 75%),
linear-gradient(-45deg,transparent 75%,#171717 75%);
background-size:24px 24px;
background-position:0 0,0 12px,12px -12px,-12px 0;
}

.image-transform{
position:absolute;
left:50%;
top:50%;
width:0;
height:0;
}

.image-transform img{
position:absolute;
left:0;
top:0;
display:block;
width:auto;
height:auto;
max-width:none;
max-height:none;
transform-origin:center center;
user-select:none;
-webkit-user-drag:none;
pointer-events:none;
}

.actions{
display:flex;
gap:8px;
padding:10px;
border-top:1px solid #292929;
flex-wrap:wrap;
}

button.action{
padding:9px 14px;
border:1px solid #444;
border-radius:8px;
background:#1a1a1a;
color:#fff;
cursor:pointer;
}

button.action:disabled{
opacity:.4;
cursor:not-allowed;
}

button.action.primary{
background:#fff;
color:#111;
border-color:#fff;
}

.file-operation-input{
display:none;
}

@media(max-width:700px){

.editor-layout{
grid-template-columns:1fr;
}

.actions{
display:grid;
grid-template-columns:1fr;
}

button.action{
width:100%;
}

.file-tree-title{
align-items:center;
}

.tree-tools{
flex:1;
min-width:0;
}

.tree-tools button{
flex:0 0 auto;
}

}
</style>
</head>

<body>

<div class="container">

<h1>MC Pack Editor</h1>

<div class="subtitle">
Minecraft Addon Editor
</div>

<div class="section">

<h2>ファイルを選択</h2>

<div class="upload">

<label class="upload-button" for="fileInput">
MCAddon / MCPack / ZIPを選択
</label>

<input
id="fileInput"
class="file-input"
type="file"
accept=".mcaddon,.mcpack,.zip,application/zip"
>

<div class="file-name" id="fileName">
未選択
</div>

</div>

</div>

<div class="editor-layout">

<div class="file-tree">

<div class="file-tree-title">

<span>ファイル構成</span>

<div class="tree-tools" id="treeTools">

<button id="moveButton" disabled>
移動
</button>

<button id="renameButton" disabled>
名前変更
</button>

<button id="deleteButton" disabled>
削除
</button>

<button id="newFileButton" disabled>
新規ファイル
</button>

<button id="newJsonButton" disabled>
新規JSON
</button>

<button id="uploadButton" disabled>
アップロード
</button>

</div>

</div>

<div class="tree-content" id="fileTree">

<div class="editor-empty">
ファイルを選択してください
</div>

</div>

</div>

<div class="editor-panel">

<div class="editor-panel-title">

<div id="editorTitle">
編集
</div>

<div class="editor-path" id="editorPath"></div>

</div>

<div class="editor-content" id="editorContent">

<div class="editor-empty">
ファイル構成から項目をタップしてください
</div>

</div>

<div class="actions">

<button class="action" id="saveButton" disabled>
保存
</button>

<button class="action" id="fileDownloadButton" disabled>
このファイルを書き出し
</button>

<button class="action primary" id="mcpackButton" disabled>
MCAddon / MCPackとして書き出し
</button>

<button class="action" id="zipButton" disabled>
ZIPとして書き出し
</button>

</div>

</div>

</div>

</div>

<input
id="newFileInput"
class="file-operation-input"
type="file"
multiple
>

<script>
const fileInput=document.getElementById("fileInput");
const newFileInput=document.getElementById("newFileInput");
const fileName=document.getElementById("fileName");
const fileTree=document.getElementById("fileTree");
const editorTitle=document.getElementById("editorTitle");
const editorPath=document.getElementById("editorPath");
const editorContent=document.getElementById("editorContent");
const saveButton=document.getElementById("saveButton");
const fileDownloadButton=document.getElementById("fileDownloadButton");
const mcpackButton=document.getElementById("mcpackButton");
const zipButton=document.getElementById("zipButton");
const treeTools=document.getElementById("treeTools");
const moveButton=document.getElementById("moveButton");
const renameButton=document.getElementById("renameButton");
const deleteButton=document.getElementById("deleteButton");
const newFileButton=document.getElementById("newFileButton");
const newJsonButton=document.getElementById("newJsonButton");
const uploadButton=document.getElementById("uploadButton");

let zip=null;
let selectedPath="";
let selectedType="";
let outputName="edited.zip";
let addonDetected=false;
let packRoots=[];
let openFolders=new Set();
let imageState={
scale:1,
x:0,
y:0
};
let imageObjectUrl="";
let moveModePath="";
let moveTargetFolder="";

function normalizePath(path){
return String(path||"")
.replace(/\\/g,"/")
.replace(/^\/+/,"")
.replace(/\/+/g,"/")
.replace(/^\.\//,"");
}

function baseName(path){
const p=normalizePath(path);
return p.split("/").pop()||"";
}

function directoryName(path){
const p=normalizePath(path);
const a=p.split("/");
a.pop();
return a.join("/");
}

function isAllowedFile(path){
const p=normalizePath(path).toLowerCase();

return [
".json",
".js",
".mcfunction",
".lang",
".txt",
".md",
".xml",
".html",
".css",
".ts",
".mcmeta",
".properties",
".material",
".render_controller",
".geo.json",
".png",
".jpg",
".jpeg",
".webp",
".gif",
".svg"
].some(x=>p.endsWith(x));
}

function isImage(path){
return /\.(png|jpe?g|webp|gif|svg)$/i.test(path);
}

function isText(path){
return !isImage(path);
}

function updateTreeTools(){
const visible=!!zip;

treeTools.style.display=visible?"flex":"none";

newFileButton.disabled=!visible;
newJsonButton.disabled=!visible;
uploadButton.disabled=!visible;

const selected=!!selectedPath;

moveButton.disabled=!selected||!!moveModePath;
renameButton.disabled=!selected||!!moveModePath;
deleteButton.disabled=!selected||!!moveModePath;
}

function clearImageUrl(){
if(imageObjectUrl){
URL.revokeObjectURL(imageObjectUrl);
imageObjectUrl="";
}
}

function updateImageTransform(){
const transform=document.getElementById("imageTransform");

if(!transform)return;

transform.style.transform=
`translate(${imageState.x}px,${imageState.y}px) scale(${imageState.scale})`;

const zoom=document.getElementById("zoomValue");

if(zoom){
zoom.textContent=Math.round(imageState.scale*100)+"%";
}
}

function resetImage(){
imageState={
scale:1,
x:0,
y:0
};

updateImageTransform();
}

function showImage(data,path){
clearImageUrl();

const blob=new Blob([data]);
imageObjectUrl=URL.createObjectURL(blob);

editorContent.innerHTML=`
<div class="image-area">
<div class="image-toolbar">
<button id="imageMinus">−</button>
<button id="imageReset">↺</button>
<div class="zoom-value" id="zoomValue">100%</div>
<button id="imagePlus">＋</button>
</div>
<div class="image-canvas" id="imageCanvas">
<div class="image-transform" id="imageTransform">
<img id="previewImage" src="${imageObjectUrl}">
</div>
</div>
</div>
`;

resetImage();

const minus=document.getElementById("imageMinus");
const plus=document.getElementById("imagePlus");
const reset=document.getElementById("imageReset");
const canvas=document.getElementById("imageCanvas");

minus.onclick=()=>{
imageState.scale=Math.max(.1,imageState.scale-.1);
updateImageTransform();
};

plus.onclick=()=>{
imageState.scale=Math.min(20,imageState.scale+.1);
updateImageTransform();
};

reset.onclick=()=>{
resetImage();
};

let dragging=false;
let startX=0;
let startY=0;
let startPX=0;
let startPY=0;

canvas.addEventListener("pointerdown",e=>{
dragging=true;
startX=e.clientX;
startY=e.clientY;
startPX=imageState.x;
startPY=imageState.y;
canvas.setPointerCapture(e.pointerId);
});

canvas.addEventListener("pointermove",e=>{
if(!dragging)return;

imageState.x=startPX+(e.clientX-startX);
imageState.y=startPY+(e.clientY-startY);

updateImageTransform();
});

canvas.addEventListener("pointerup",()=>{
dragging=false;
});

canvas.addEventListener("pointercancel",()=>{
dragging=false;
});

canvas.addEventListener("wheel",e=>{
e.preventDefault();

if(e.deltaY<0){
imageState.scale=Math.min(20,imageState.scale*1.1);
}else{
imageState.scale=Math.max(.1,imageState.scale/1.1);
}

updateImageTransform();
},{passive:false});
}

function showText(path,text){
editorContent.innerHTML="";

const textarea=document.createElement("textarea");

textarea.value=text;
textarea.id="editorTextarea";

editorContent.appendChild(textarea);

saveButton.disabled=false;

saveButton.onclick=async()=>{
if(!zip||!selectedPath)return;

zip.file(selectedPath,textarea.value);

await refreshAddonDetection();

renderTree();

saveButton.textContent="保存しました";

setTimeout(()=>{
saveButton.textContent="保存";
},1000);
};
}

function showEmpty(){
editorContent.innerHTML=`
<div class="editor-empty">
このファイルは編集できません
</div>
`;

saveButton.disabled=true;
}

function buildTree(){
const root={
folders:new Map(),
files:[]
};

const directoryEntries=[];
const fileEntries=[];

zip.forEach((path,entry)=>{

const normalized=normalizePath(path).replace(/\/$/,"");

if(!normalized)return;

if(entry.dir){
directoryEntries.push(normalized);
}else{
fileEntries.push(normalized);
}

});

function ensureFolder(pathParts){

let node=root;

for(const part of pathParts){

if(!part)continue;

if(!node.folders.has(part)){
node.folders.set(part,{
folders:new Map(),
files:[]
});
}

node=node.folders.get(part);
}

}

for(const path of directoryEntries){

ensureFolder(path.split("/"));

}

fileEntries.sort((a,b)=>a.localeCompare(b));

for(const path of fileEntries){

const parts=path.split("/");

const file=parts.pop();

let node=root;

for(const part of parts){

if(!node.folders.has(part)){
node.folders.set(part,{
folders:new Map(),
files:[]
});
}

node=node.folders.get(part);

}

if(file){
node.files.push(file);
}

}

return root;
}

function renderTree(){

if(!zip){

fileTree.innerHTML=`
<div class="editor-empty">
ファイルを選択してください
</div>
`;

updateTreeTools();

return;
}

const root=buildTree();

fileTree.innerHTML="";

const fragment=document.createDocumentFragment();

function renderNode(node,parentPath,depth){

const folders=[...node.folders.keys()]
.sort((a,b)=>{

if(moveModePath){

const aSpecial=
a.toUpperCase()==="RP"||
a.toUpperCase()==="BP";

const bSpecial=
b.toUpperCase()==="RP"||
b.toUpperCase()==="BP";

if(aSpecial&&!bSpecial)return -1;
if(!aSpecial&&bSpecial)return 1;
}

return a.localeCompare(b);
});

const files=[...node.files]
.sort((a,b)=>a.localeCompare(b));

for(const folderName of folders){

const fullPath=parentPath
?parentPath+"/"+folderName
:folderName;

const open=openFolders.has(fullPath);

const button=document.createElement("button");

button.className=
"tree-item folder tree-indent-"+Math.min(depth+1,5);

button.dataset.path=fullPath;
button.dataset.folder="true";

if(selectedPath===fullPath){
button.classList.add("selected-folder");
}

if(moveTargetFolder===fullPath){
button.classList.add("selected-folder");
}

button.innerHTML=`
<span class="tree-arrow">${open?"▼":"▶"}</span>
${escapeHtml(folderName)}
`;

button.onclick=async()=>{

if(moveModePath){

if(
fullPath===moveModePath||
fullPath.startsWith(moveModePath+"/")
){

return;
}

moveTargetFolder=fullPath;

renderTree();

return;
}

selectedPath=fullPath;
selectedType="folder";

moveTargetFolder="";

editorTitle.textContent=folderName;
editorPath.textContent=fullPath;

fileDownloadButton.disabled=true;
saveButton.disabled=true;

editorContent.innerHTML=`
<div class="editor-empty">
フォルダを選択しています
</div>
`;

if(open){
openFolders.delete(fullPath);
}else{
openFolders.add(fullPath);
}

renderTree();
};

fragment.appendChild(button);

if(open){

renderNode(
node.folders.get(folderName),
fullPath,
depth+1
);

}
}

for(const file of files){

const fullPath=parentPath
?parentPath+"/"+file
:file;

const button=document.createElement("button");

button.className=
"tree-item file tree-indent-"+Math.min(depth+1,5);

button.dataset.path=fullPath;
button.dataset.folder="false";

if(selectedPath===fullPath){
button.classList.add("selected-file");
}

button.innerHTML=`
<span class="tree-arrow"></span>
${escapeHtml(file)}
`;

button.onclick=async()=>{

if(moveModePath){

return;
}

await openFile(fullPath);
};

fragment.appendChild(button);
}

}

renderNode(root,"",0);

fileTree.appendChild(fragment);

if(moveModePath){

const panel=document.createElement("div");

panel.className="move-panel visible";

const text=document.createElement("div");

text.className="move-panel-text";

text.textContent=
moveTargetFolder
?`移動先: ${moveTargetFolder}`
:"移動先: ルート";

const buttons=document.createElement("div");

buttons.className="move-panel-buttons";

const cancel=document.createElement("button");

cancel.textContent="キャンセル";

cancel.onclick=()=>{
moveModePath="";
moveTargetFolder="";
renderTree();
};

const confirmButton=document.createElement("button");

confirmButton.className="move-confirm";

confirmButton.textContent="移動";

confirmButton.onclick=async()=>{
await moveSelectedFile(moveTargetFolder);
};

buttons.appendChild(cancel);
buttons.appendChild(confirmButton);

panel.appendChild(text);
panel.appendChild(buttons);

fileTree.appendChild(panel);
}

updateTreeTools();
}

function escapeHtml(value){
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

async function openFile(path){

if(!zip)return;

if(moveModePath)return;

path=normalizePath(path);

const entry=zip.file(path);

if(!entry)return;

selectedPath=path;
selectedType=isImage(path)?"image":"text";
moveModePath="";
moveTargetFolder="";

editorTitle.textContent=baseName(path);
editorPath.textContent=path;

fileDownloadButton.disabled=false;

renderTree();

if(isImage(path)){

const data=await entry.async("uint8array");

showImage(data,path);

return;
}

if(isText(path)){

try{

const text=await entry.async("string");

showText(path,text);

}catch{

showEmpty();

}

return;
}

showEmpty();
}

async function moveSelectedFile(targetFolder){

if(!zip||!moveModePath)return;

const source=normalizePath(moveModePath);
const target=normalizePath(targetFolder);

const name=baseName(source);

const newPath=target
?target+"/"+name
:name;

if(newPath===source){

moveModePath="";
moveTargetFolder="";

renderTree();

return;
}

if(
source===target||
target.startsWith(source+"/")
){

alert("自分自身またはその中には移動できません。");

return;
}

let duplicate=false;

zip.forEach((path,entry)=>{

const normalized=normalizePath(path).replace(/\/$/,"");

if(normalized===newPath){
duplicate=true;
}

});

if(duplicate){

alert("同名の項目が存在します。");

return;
}

const sourceEntry=zip.file(source);

if(sourceEntry){

const data=await sourceEntry.async("uint8array");

zip.remove(source);

zip.file(newPath,data);

}else{

let found=false;
const entries=[];

zip.forEach((path,entry)=>{

const normalized=normalizePath(path);

if(
normalized===source||
normalized.startsWith(source+"/")
){

entries.push({
path:normalized,
entry:entry
});

found=true;
}

});

if(!found){

moveModePath="";
moveTargetFolder="";

renderTree();

return;
}

for(const item of entries){

const relative=item.path===source
?""
:item.path.slice(source.length+1);

const destination=newPath+(relative?"/"+relative:"");

if(item.entry.dir){

zip.folder(destination);

}else{

const data=await item.entry.async("uint8array");

zip.file(destination,data);
}

}

for(const item of entries){

zip.remove(item.path);

}

}

selectedPath=newPath;
moveModePath="";
moveTargetFolder="";

await refreshAddonDetection();

renderTree();

if(zip.file(newPath)){
await openFile(newPath);
}else{

selectedType="folder";
editorTitle.textContent=baseName(newPath);
editorPath.textContent=newPath;
fileDownloadButton.disabled=true;
saveButton.disabled=true;

editorContent.innerHTML=`
<div class="editor-empty">
フォルダを選択しています
</div>
`;

renderTree();
}
}

async function renameSelected(){

if(!zip||!selectedPath)return;

const oldPath=normalizePath(selectedPath);
const oldName=baseName(oldPath);

const input=prompt(
"新しい名前を入力してください",
oldName
);

if(input===null)return;

let newName=input.trim();

if(!newName)return;

newName=newName.replace(/[\\\/]/g,"");

if(!newName){

alert("名前が不正です。");

return;
}

const directory=directoryName(oldPath);

const newPath=directory
?directory+"/"+newName
:newName;

if(newPath===oldPath)return;

let duplicate=false;

zip.forEach((path,entry)=>{

const normalized=normalizePath(path).replace(/\/$/,"");

if(normalized===newPath){
duplicate=true;
}

});

if(duplicate){

alert("同名の項目が存在します。");

return;
}

const fileEntry=zip.file(oldPath);

if(fileEntry){

const data=await fileEntry.async("uint8array");

zip.remove(oldPath);

zip.file(newPath,data);

}else{

const entries=[];

zip.forEach((path,entry)=>{

const normalized=normalizePath(path);

if(
normalized===oldPath||
normalized.startsWith(oldPath+"/")
){

entries.push({
path:normalized,
entry:entry
});

}

});

if(!entries.length)return;

for(const item of entries){

const relative=item.path===oldPath
?""
:item.path.slice(oldPath.length+1);

const destination=newPath+(relative?"/"+relative:"");

if(item.entry.dir){

zip.folder(destination);

}else{

const data=await item.entry.async("uint8array");

zip.file(destination,data);
}

}

for(const item of entries){

zip.remove(item.path);

}

}

selectedPath=newPath;

await refreshAddonDetection();

renderTree();

if(zip.file(newPath)){
await openFile(newPath);
}else{

selectedType="folder";
editorTitle.textContent=baseName(newPath);
editorPath.textContent=newPath;
fileDownloadButton.disabled=true;
saveButton.disabled=true;

editorContent.innerHTML=`
<div class="editor-empty">
フォルダを選択しています
</div>
`;

renderTree();
}
}

async function deleteSelected(){

if(!zip||!selectedPath)return;

const path=selectedPath;

if(!confirm(
`「${baseName(path)}」を削除しますか？`
)){
return;
}

const fileEntry=zip.file(path);

if(fileEntry){

zip.remove(path);

}else{

const removeList=[];

zip.forEach((entryPath,entry)=>{

const normalized=normalizePath(entryPath);

if(
normalized===path||
normalized.startsWith(path+"/")
){

removeList.push(normalized);

}

});

for(const entryPath of removeList){

zip.remove(entryPath);

}

}

selectedPath="";
selectedType="";
moveModePath="";
moveTargetFolder="";

editorTitle.textContent="編集";
editorPath.textContent="";

editorContent.innerHTML=`
<div class="editor-empty">
ファイル構成から項目をタップしてください
</div>
`;

saveButton.disabled=true;
fileDownloadButton.disabled=true;

await refreshAddonDetection();

renderTree();
}

function createNewFile(){

if(!zip)return;

const name=prompt("新規フォルダ名を入力してください");

if(!name)return;

let path=normalizePath(name).replace(/\/+$/,"");

if(!path)return;

const parts=path.split("/");

if(parts.some(part=>part==="."||part==="..")){

alert("フォルダ名が不正です。");

return;
}

let exists=false;

zip.forEach((entryPath,entry)=>{

const normalized=normalizePath(entryPath).replace(/\/+$/,"");

if(
normalized===path||
normalized.startsWith(path+"/")
){

exists=true;

}

});

if(exists){

alert("同名のフォルダが存在します。");

return;
}

zip.folder(path);

renderTree();

refreshAddonDetection().then(()=>{
renderTree();
});
}

function createNewJson(){

if(!zip)return;

const name=prompt("新規JSONファイル名を入力してください");

if(!name)return;

let path=normalizePath(name);

if(!path)return;

if(!path.toLowerCase().endsWith(".json")){
path+=".json";
}

if(zip.file(path)){

alert("同名のファイルが存在します。");

return;
}

zip.file(
path,
JSON.stringify({},null,2)
);

renderTree();

refreshAddonDetection().then(()=>{
renderTree();
});
}

async function uploadFiles(files){

if(!zip)return;

for(const file of files){

let path=normalizePath(
file.webkitRelativePath||file.name
);

if(!path)continue;

if(zip.file(path)){

const overwrite=confirm(
`「${path}」は既に存在します。\n上書きしますか？`
);

if(!overwrite)continue;
}

const data=await file.arrayBuffer();

zip.file(
path,
new Uint8Array(data)
);
}

removeUnnecessaryFiles();

await refreshAddonDetection();

renderTree();
}

function isUnnecessaryPath(path){

const normalized=normalizePath(path).replace(/\/+$/,"");

if(!normalized)return false;

const parts=normalized.split("/");

for(const part of parts){

if(
part.startsWith("__")||
part.startsWith("._")||
part===".DS_Store"||
part==="Thumbs.db"||
part==="Desktop.ini"
){

return true;

}

}

return false;
}

function removeUnnecessaryFiles(){

if(!zip)return;

const removeList=[];

zip.forEach((path,entry)=>{

const normalized=normalizePath(path);

if(isUnnecessaryPath(normalized)){

removeList.push(normalized);

}

});

const unique=[...new Set(removeList)];

for(const path of unique){

zip.remove(path);

}
}

async function normalizePackStructure(){

if(!zip)return;

const entries=[];

zip.forEach((path,entry)=>{

if(entry.dir)return;

const normalized=normalizePath(path);

if(normalized){
entries.push(normalized);
}

});

const packTypes=["RP","BP"];

for(const packType of packTypes){

const candidates=entries.filter(path=>{

const parts=path.split("/");

return parts.some(
part=>part.toUpperCase()===packType
);

});

if(!candidates.length)continue;

let packRoot="";

for(const path of candidates){

const parts=path.split("/");

const index=parts.findIndex(
part=>part.toUpperCase()===packType
);

if(index<0)continue;

const candidate=parts
.slice(0,index+1)
.join("/");

if(
!packRoot||
candidate.length<packRoot.length
){

packRoot=candidate;

}
}

if(!packRoot)continue;

const manifestCandidates=entries.filter(path=>{

const parts=path.split("/");

const packIndex=parts.findIndex(
part=>part.toUpperCase()===packType
);

return (
packIndex>=0&&
parts[parts.length-1].toLowerCase()==="manifest.json"
);

});

if(!manifestCandidates.length)continue;

const packEntries=entries.filter(path=>{

return (
path===packRoot||
path.startsWith(packRoot+"/")
);

});

const packIndex=packRoot.split("/").length-1;

for(const oldPath of packEntries){

const parts=oldPath.split("/");

const index=parts.findIndex(
part=>part.toUpperCase()===packType
);

if(index<0)continue;

const newPath=parts
.slice(index)
.join("/");

if(oldPath===newPath)continue;

const entry=zip.file(oldPath);

if(!entry)continue;

const data=await entry.async("uint8array");

if(!zip.file(newPath)){
zip.file(newPath,data);
}

zip.remove(oldPath);
}

}

}

async function refreshAddonDetection(){

if(!zip){

addonDetected=false;
packRoots=[];

return;
}

const names=[];

zip.forEach((path,entry)=>{

if(!entry.dir){

names.push(
normalizePath(path)
);

}
});

const roots=new Set();

for(const path of names){

const first=path.split("/")[0];

if(path.includes("/")){
roots.add(first);
}

}

packRoots=[...roots];

addonDetected=
names.includes("manifest.json")||
names.some(
x=>x.endsWith("/manifest.json")
);

return addonDetected;
}

async function readPack(){

const file=fileInput.files[0];

if(!file)return;

fileName.textContent=file.name;

outputName=file.name;

try{

const data=await file.arrayBuffer();

zip=await JSZip.loadAsync(data);

removeUnnecessaryFiles();

await normalizePackStructure();

removeUnnecessaryFiles();

selectedPath="";
selectedType="";
moveModePath="";
moveTargetFolder="";
openFolders.clear();

editorTitle.textContent="編集";
editorPath.textContent="";

editorContent.innerHTML=`
<div class="editor-empty">
ファイル構成から項目をタップしてください
</div>
`;

saveButton.disabled=true;
fileDownloadButton.disabled=true;
mcpackButton.disabled=false;
zipButton.disabled=false;

await refreshAddonDetection();

renderTree();

updateTreeTools();

}catch(error){

zip=null;

fileTree.innerHTML=`
<div class="editor-empty">
ファイルを読み込めませんでした
</div>
`;

editorContent.innerHTML=`
<div class="editor-empty">
読み込みに失敗しました
</div>
`;

saveButton.disabled=true;
fileDownloadButton.disabled=true;
mcpackButton.disabled=true;
zipButton.disabled=true;

updateTreeTools();

alert("ファイルの読み込みに失敗しました。");
}
}

async function downloadBlob(blob,name){

const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download=name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);
}

async function downloadSelectedFile(){

if(!zip||!selectedPath)return;

const entry=zip.file(selectedPath);

if(!entry)return;

const data=await entry.async("blob");

await downloadBlob(
data,
baseName(selectedPath)
);
}

async function makeZip(){

if(!zip)return null;

removeUnnecessaryFiles();

return await zip.generateAsync({
type:"blob",
compression:"DEFLATE",
compressionOptions:{
level:6
}
});
}

async function downloadZip(){

if(!zip)return;

const blob=await makeZip();

await downloadBlob(
blob,
outputName.replace(
/\.(mcaddon|mcpack|zip)$/i,
""
)+".zip"
);
}

async function downloadMcPack(){

if(!zip)return;

const blob=await makeZip();

let name=outputName.replace(
/\.(mcaddon|mcpack|zip)$/i,
""
);

if(!name){
name="edited";
}

const extension=addonDetected
?".mcaddon"
:".mcpack";

await downloadBlob(
blob,
name+extension
);
}

fileInput.addEventListener(
"change",
readPack
);

moveButton.onclick=()=>{
if(!selectedPath)return;

moveModePath=selectedPath;
moveTargetFolder=directoryName(selectedPath);

renderTree();
};

renameButton.onclick=()=>{
renameSelected();
};

deleteButton.onclick=()=>{
deleteSelected();
};

newFileButton.onclick=()=>{
createNewFile();
};

newJsonButton.onclick=()=>{
createNewJson();
};

uploadButton.onclick=()=>{
newFileInput.click();
};

newFileInput.addEventListener(
"change",
async()=>{
if(newFileInput.files.length){
await uploadFiles(
[...newFileInput.files]
);
}

newFileInput.value="";
}
);

fileDownloadButton.onclick=()=>{
downloadSelectedFile();
};

zipButton.onclick=()=>{
downloadZip();
};

mcpackButton.onclick=()=>{
downloadMcPack();
};

document.addEventListener(
"keydown",
async e=>{

if(!zip||!selectedPath)return;

const tag=
document.activeElement?.tagName?.toLowerCase();

if(
tag==="textarea"||
tag==="input"
)return;

if(
e.key==="Delete"||
e.key==="Backspace"
){

e.preventDefault();

await deleteSelected();

}
}
);

window.addEventListener(
"beforeunload",
()=>{
clearImageUrl();
}
);
</script>
