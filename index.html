<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>MC Pack Editor Test</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
*{
box-sizing:border-box;
}

body{
margin:0;
background:#111;
color:#fff;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

.container{
max-width:1000px;
margin:auto;
padding:24px 16px 50px;
}

h1{
margin:0 0 8px;
font-size:28px;
}

.subtitle{
color:#888;
margin-bottom:24px;
}

.section{
background:#1a1a1a;
border:1px solid #292929;
border-radius:14px;
padding:18px;
margin-bottom:16px;
}

.section h2{
margin:0 0 16px;
font-size:18px;
}

.upload{
border:1px dashed #444;
border-radius:12px;
padding:22px;
text-align:center;
background:#111;
}

.file-input{
display:none;
}

.upload-button{
display:inline-block;
padding:13px 20px;
border-radius:10px;
background:#fff;
color:#111;
font-weight:bold;
cursor:pointer;
}

.file-name{
margin-top:12px;
color:#888;
font-size:13px;
word-break:break-all;
}

.editor-layout{
display:grid;
grid-template-columns:320px 1fr;
gap:16px;
}

.file-tree,
.editor-panel{
background:#0d0d0d;
border:1px solid #292929;
border-radius:12px;
overflow:hidden;
}

.file-tree-title,
.editor-panel-title{
padding:13px 14px;
border-bottom:1px solid #292929;
font-weight:bold;
}

.tree-content{
padding:8px;
}

.tree-item{
display:block;
width:100%;
padding:10px 10px;
margin:2px 0;
border:0;
border-radius:8px;
background:transparent;
color:#fff;
text-align:left;
font-size:14px;
cursor:pointer;
}

.tree-item:hover{
background:#1c1c1c;
}

.folder{
font-weight:700;
cursor:default;
}

.file{
font-weight:400;
}

.tree-indent-1{
padding-left:34px;
}

.tree-indent-2{
padding-left:58px;
}

.tree-indent-3{
padding-left:82px;
}

.tree-indent-4{
padding-left:106px;
}

.tree-indent-5{
padding-left:130px;
}

.editor-path{
display:block;
margin-top:4px;
color:#777;
font-size:11px;
font-weight:normal;
word-break:break-all;
}

.editor-content{
min-height:420px;
}

.editor-empty{
min-height:420px;
display:flex;
align-items:center;
justify-content:center;
text-align:center;
padding:30px;
color:#777;
}

textarea{
display:block;
width:100%;
height:520px;
resize:vertical;
border:0;
outline:none;
padding:15px;
background:#080808;
color:#ddd;
font-family:ui-monospace,SFMono-Regular,Menlo,Monaco,Consolas,monospace;
font-size:13px;
line-height:1.6;
}

.image-preview{
min-height:420px;
padding:20px;
display:flex;
align-items:center;
justify-content:center;
background:#080808;
}

.image-preview img{
display:block;
max-width:100%;
max-height:520px;
width:auto;
height:auto;
object-fit:contain;
image-rendering:auto;
}

.image-preview-wrap{
width:100%;
min-height:380px;
display:flex;
align-items:center;
justify-content:center;
}

.actions{
display:flex;
gap:8px;
padding:10px;
border-top:1px solid #292929;
}

button.action{
padding:9px 14px;
border:1px solid #444;
border-radius:8px;
background:#1a1a1a;
color:#fff;
cursor:pointer;
}

button.action:disabled{
opacity:.4;
cursor:not-allowed;
}

@media(max-width:700px){

.editor-layout{
grid-template-columns:1fr;
}

}
</style>
</head>

<body>

<div class="container">

<h1>MC Pack Editor</h1>

<div class="subtitle">
MCAddon / MCPack / ZIP
</div>

<div class="section">

<h2>ファイルを選択</h2>

<div class="upload">

<label class="upload-button" for="fileInput">
MCAddon / MCPack / ZIPを選択
</label>

<input
id="fileInput"
class="file-input"
type="file"
accept=".mcaddon,.mcpack,.zip,application/zip"
>

<div class="file-name" id="fileName">
未選択
</div>

</div>

</div>

<div class="editor-layout">

<div class="file-tree">

<div class="file-tree-title">
ファイル構成
</div>

<div class="tree-content" id="fileTree">

<div class="editor-empty">
ファイルを選択してください
</div>

</div>

</div>

<div class="editor-panel">

<div class="editor-panel-title">

<div id="editorTitle">
編集
</div>

<div class="editor-path" id="editorPath"></div>

</div>

<div class="editor-content" id="editorContent">

<div class="editor-empty">
ファイル構成から項目をタップしてください
</div>

</div>

<div class="actions">

<button class="action" id="saveButton" disabled>
保存
</button>

<button class="action" id="downloadButton" disabled>
書き出し
</button>

</div>

</div>

</div>

</div>

<script>

const fileInput=document.getElementById("fileInput");
const fileName=document.getElementById("fileName");
const fileTree=document.getElementById("fileTree");
const editorTitle=document.getElementById("editorTitle");
const editorPath=document.getElementById("editorPath");
const editorContent=document.getElementById("editorContent");
const saveButton=document.getElementById("saveButton");
const downloadButton=document.getElementById("downloadButton");

let zip=null;
let selectedPath="";
let selectedType="";
let outputName="edited.zip";



function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



function isText(path){

const lower=path.toLowerCase();

return(
lower.endsWith(".json")||
lower.endsWith(".js")||
lower.endsWith(".mcfunction")||
lower.endsWith(".lang")||
lower.endsWith(".txt")||
lower.endsWith(".md")||
lower.endsWith(".html")||
lower.endsWith(".css")||
lower.endsWith(".xml")||
lower.endsWith(".yml")||
lower.endsWith(".yaml")
);

}



function isImage(path){

const lower=path.toLowerCase();

return(
lower.endsWith(".png")||
lower.endsWith(".jpg")||
lower.endsWith(".jpeg")||
lower.endsWith(".webp")||
lower.endsWith(".gif")
);

}



function isAllowedFile(path){

const lower=path.toLowerCase();

if(
lower.includes("__macosx/")||
lower.startsWith("__macosx")||
lower.endsWith("/.ds_store")||
lower===".ds_store"||
lower.endsWith("/thumbs.db")||
lower==="thumbs.db"||
lower.endsWith(".db")||
lower.endsWith(".bak")||
lower.endsWith(".tmp")||
lower.endsWith(".log")
){
return false;
}

return(
isText(path)||
isImage(path)
);

}



function getIcon(path){

if(isImage(path)){
return "🖼️";
}

if(isText(path)){
return "📄";
}

return "📦";

}



fileInput.onchange=async()=>{

const file=fileInput.files[0];

if(!file){
return;
}

fileName.textContent=file.name;

outputName=file.name;

try{

zip=await JSZip.loadAsync(file);

renderTree();

downloadButton.disabled=false;

editorTitle.textContent="編集";

editorPath.textContent="";

editorContent.innerHTML=
'<div class="editor-empty">ファイル構成から項目をタップしてください</div>';

saveButton.disabled=true;

}catch(error){

zip=null;

fileTree.innerHTML=
'<div class="editor-empty">読み込みに失敗しました<br><br>'+
escapeHtml(error.message)+
'</div>';

downloadButton.disabled=true;

}

};



function renderTree(){

fileTree.innerHTML="";

const paths=[];

zip.forEach((path,entry)=>{

if(entry.dir){
return;
}

if(!isAllowedFile(path)){
return;
}

paths.push(path);

});

paths.sort((a,b)=>a.localeCompare(b));

if(paths.length===0){

fileTree.innerHTML=
'<div class="editor-empty">表示できるファイルがありません</div>';

return;

}



const nodes=new Map();

function addFolder(path){

if(!path){
return;
}

if(!nodes.has(path)){

nodes.set(path,{
path:path,
folder:true,
children:new Set()
});

}

}



function addFile(path){

nodes.set(path,{
path:path,
folder:false,
children:new Set()
});

}



paths.forEach(path=>{

const parts=path.split("/");

let current="";

for(let i=0;i<parts.length-1;i++){

current=current
?current+"/"+parts[i]
:parts[i];

addFolder(current);

}

addFile(path);

});



nodes.forEach(node=>{

if(node.folder){
return;
}

const parts=node.path.split("/");

if(parts.length>1){

const parent=parts
.slice(0,-1)
.join("/");

if(nodes.has(parent)){
nodes.get(parent).children.add(node.path);
}

}

});



const root=[];

nodes.forEach(node=>{

if(!node.path.includes("/")){

root.push(node);

}

});



function sortNodes(list){

return list.sort((a,b)=>{

if(a.folder!==b.folder){
return a.folder?-1:1;
}

const an=a.path.split("/").pop();
const bn=b.path.split("/").pop();

return an.localeCompare(bn);

});

}



function renderNode(node,depth){

const button=document.createElement("button");

button.className="tree-item";

if(node.folder){

button.classList.add("folder");

}else{

button.classList.add("file");

}



if(depth===1){
button.classList.add("tree-indent-1");
}

if(depth===2){
button.classList.add("tree-indent-2");
}

if(depth===3){
button.classList.add("tree-indent-3");
}

if(depth===4){
button.classList.add("tree-indent-4");
}

if(depth>=5){
button.classList.add("tree-indent-5");
}



const name=node.path.split("/").pop();

button.innerHTML=
(node.folder?"📁 ":"")+ 
(!node.folder?getIcon(node.path)+" ":"")+
escapeHtml(name);



if(!node.folder){

button.onclick=()=>{

openFile(node.path);

};

}



fileTree.appendChild(button);



if(node.folder){

const children=[];

nodes.forEach(child=>{

if(!child.path.includes("/")){
return;
}

const parent=child.path
.split("/")
.slice(0,-1)
.join("/");

if(parent===node.path){

children.push(child);

}

});

sortNodes(children);

children.forEach(child=>{

renderNode(child,depth+1);

});

}

}



sortNodes(root);

root.forEach(node=>{

renderNode(node,0);

});

}



async function openFile(path){

if(!zip){
return;
}

const entry=zip.file(path);

if(!entry){
return;
}

selectedPath=path;

editorTitle.textContent=
path.split("/").pop();

editorPath.textContent=path;



if(isText(path)){

const text=
await entry.async("string");

selectedType="text";

const textarea=
document.createElement("textarea");

textarea.id="editorTextarea";

textarea.value=text;

editorContent.innerHTML="";

editorContent.appendChild(textarea);

saveButton.disabled=false;

return;

}



if(isImage(path)){

selectedType="image";

const blob=
await entry.async("blob");

const url=
URL.createObjectURL(blob);

editorContent.innerHTML="";

const preview=
document.createElement("div");

preview.className="image-preview";

const wrap=
document.createElement("div");

wrap.className="image-preview-wrap";

const img=
document.createElement("img");

img.src=url;

img.alt=path;

wrap.appendChild(img);

preview.appendChild(wrap);

editorContent.appendChild(preview);

saveButton.disabled=true;

return;

}



selectedType="other";

saveButton.disabled=true;

editorContent.innerHTML=
'<div class="editor-empty">'+
"このファイルはプレビュー・編集に対応していません。"+
'</div>';

}



saveButton.onclick=()=>{

if(
!zip||
!selectedPath||
selectedType!=="text"
){
return;
}

const textarea=
document.getElementById("editorTextarea");

if(!textarea){
return;
}

zip.file(
selectedPath,
textarea.value
);

saveButton.textContent="保存しました";

setTimeout(()=>{

saveButton.textContent="保存";

},1200);

};



downloadButton.onclick=async()=>{

if(!zip){
return;
}

downloadButton.disabled=true;

downloadButton.textContent="生成中...";

try{

const blob=
await zip.generateAsync({
type:"blob",
compression:"DEFLATE",
compressionOptions:{
level:9
}
});

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;

a.download=outputName;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(()=>{

URL.revokeObjectURL(url);

},1000);

downloadButton.textContent="書き出し完了";

setTimeout(()=>{

downloadButton.textContent="書き出し";

downloadButton.disabled=false;

},1200);

}catch(error){

downloadButton.textContent="書き出し";

downloadButton.disabled=false;

alert(error.message);

}

};

</script>

</body>
</html>
