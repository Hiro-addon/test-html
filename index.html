id="fileInput"

type="file"
accept=".mcaddon,.mcpack,.zip,application/zip"
>

</div>

ファイル構成
</div>

<script>

const fileInput=document.getElementById("fileInput");
const newFileInput=document.getElementById("newFileInput");
const fileName=document.getElementById("fileName");
const fileTree=document.getElementById("fileTree");
const editorTitle=document.getElementById("editorTitle");
const editorPath=document.getElementById("editorPath");
const editorContent=document.getElementById("editorContent");
const saveButton=document.getElementById("saveButton");
const fileDownloadButton=document.getElementById("fileDownloadButton");
const mcpackButton=document.getElementById("mcpackButton");
const zipButton=document.getElementById("zipButton");

let zip=null;
let selectedPath="";
let selectedType="";
let outputName="edited.zip";
let addonDetected=false;
let packRoots=[];

let openFolders=new Set();

let imageState={
scale:1,
x:0,
y:0
};

let imageObjectUrl="";

let currentTreeFolder="";

let longPressTimer=null;
let longPressPointerId=null;
let longPressStarted=false;
let dragPath="";
let dragPointerId=null;
let dragStartX=0;
let dragStartY=0;
let activePointers=new Set();



function escapeHtml(value){

return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");

}



function normalizePath(path){

return path
.replace(/\\/g,"/")
.replace(/^\/+/,"")
.replace(/\/+/g,"/")
.replace(/^\.\//,"")
.replace(/\/$/,"");

}



function isText(path){

const lower=path.toLowerCase();

return(
lower.endsWith(".json")||
lower.endsWith(".js")||
lower.endsWith(".mcfunction")||
lower.endsWith(".lang")||
lower.endsWith(".txt")||
lower.endsWith(".md")||
lower.endsWith(".html")||
lower.endsWith(".css")||
lower.endsWith(".xml")||
lower.endsWith(".yml")||
lower.endsWith(".yaml")
);

}



function isImage(path){

const lower=path.toLowerCase();

return(
lower.endsWith(".png")||
lower.endsWith(".jpg")||
lower.endsWith(".jpeg")||
lower.endsWith(".webp")||
lower.endsWith(".gif")
);

}



function isManifest(path){

return normalizePath(path)
.toLowerCase()
.split("/")
.pop()==="manifest.json";

}



function isAllowedFile(path){

const lower=path.toLowerCase();

if(
lower.includes("__macosx/")||
lower.startsWith("__macosx")||
lower.endsWith("/.ds_store")||
lower===".ds_store"||
lower.endsWith("/thumbs.db")||
lower==="thumbs.db"||
lower.endsWith(".bak")||
lower.endsWith(".tmp")||
lower.endsWith(".log")
){
return false;
}

return(
isText(path)||
isImage(path)
);

}



function getIcon(path){

if(isImage(path)){
return "🖼️";
}

if(isText(path)){
return "📄";
}

return "📦";

}



async function detectMinecraftAddon(){

if(!zip){

return{
detected:false,
packs:[]
};

}

const manifests=[];

zip.forEach((path,entry)=>{

if(entry.dir){
return;
}

if(!isManifest(path)){
return;
}

manifests.push({
path:normalizePath(path),
entry:entry
});

});

const validPacks=[];

for(const item of manifests){

try{

const text=
await item.entry.async("string");

const json=
JSON.parse(text);

if(
!json||
typeof json!=="object"||
!json.header||
typeof json.header!=="object"||
!Array.isArray(json.modules)
){
continue;
}

if(
typeof json.header.name==="undefined"&&
typeof json.header.uuid==="undefined"
){
continue;
}

const parts=item.path.split("/");

parts.pop();

const root=parts.join("/");

if(!root){
continue;
}

let packType="Pack";

const modules=json.modules||[];

if(
modules.some(module=>
module&&module.type==="resources"
)
){

packType="RP";

}

if(
modules.some(module=>
module&&module.type==="data"
)
){

packType="BP";

}

validPacks.push({
root:root,
type:packType,
manifest:item.path
});

}catch(error){

}

}

return{
detected:validPacks.length>0,
packs:validPacks
};

}



function getPackRoot(path){

const normalized=normalizePath(path);

let result="";

for(const pack of packRoots){

if(
normalized===pack.root||
normalized.startsWith(pack.root+"/")
){

if(
pack.root.length>result.length
){

result=pack.root;

}

}

}

return result;

}



function sortPackRoots(){

const priority={
"RP":0,
"BP":1,
"Pack":2
};

packRoots.sort((a,b)=>{

const ap=priority[a.type]??3;
const bp=priority[b.type]??3;

if(ap!==bp){
return ap-bp;
}

return a.root.localeCompare(b.root);

});

}



function getDirectory(path){

const normalized=normalizePath(path);

const parts=normalized.split("/");

parts.pop();

return parts.join("/");

}



function uniquePath(path){

path=normalizePath(path);

if(!zip.file(path)){
return path;
}

const parts=path.split("/");

const name=parts.pop();

const dir=parts.join("/");

const dot=name.lastIndexOf(".");

let base=dot>0?name.slice(0,dot):name;
const ext=dot>0?name.slice(dot):"";

let number=2;

let candidate;

do{

candidate=
(dir?dir+"/":"")+
base+" ("+number+")"+ext;

number++;

}while(zip.file(candidate));

return candidate;

}



function refreshAddonDetection(){

return detectMinecraftAddon()
.then(result=>{

addonDetected=result.detected;
packRoots=result.packs;

sortPackRoots();

});

}



fileInput.onchange=async()=>{

const file=fileInput.files[0];

if(!file){
return;
}

fileName.textContent=file.name;
outputName=file.name;

try{

zip=await JSZip.loadAsync(file);

const result=
await detectMinecraftAddon();

addonDetected=result.detected;
packRoots=result.packs;

sortPackRoots();

openFolders.clear();

renderTree();

mcpackButton.disabled=!addonDetected;
zipButton.disabled=false;

editorTitle.textContent="編集";
editorPath.textContent="";

editorContent.innerHTML=
'<div class="editor-empty">ファイル構成から項目をタップしてください</div>';

saveButton.disabled=true;
fileDownloadButton.disabled=true;

}catch(error){

zip=null;
addonDetected=false;
packRoots=[];

fileTree.innerHTML=
'<div class="editor-empty">読み込みに失敗しました<br><br>'+
escapeHtml(error.message)+
'</div>';

mcpackButton.disabled=true;
zipButton.disabled=true;
saveButton.disabled=true;
fileDownloadButton.disabled=true;

}

};



function renderTree(){

fileTree.innerHTML="";

if(!zip){
return;
}

const paths=[];

zip.forEach((path,entry)=>{

if(entry.dir){
return;
}

const normalized=normalizePath(path);

if(!isAllowedFile(normalized)){
return;
}

paths.push(normalized);

});



const rootGroups=new Map();

paths.forEach(path=>{

const root=getPackRoot(path);

const displayRoot=
root||path.split("/")[0];

if(!rootGroups.has(displayRoot)){
rootGroups.set(displayRoot,[]);
}

rootGroups.get(displayRoot).push(path);

});



const groups=[];

packRoots.forEach(pack=>{

if(rootGroups.has(pack.root)){

groups.push({
root:pack.root,
type:pack.type,
paths:rootGroups.get(pack.root)
});

rootGroups.delete(pack.root);

}

});



Array.from(rootGroups.keys())
.sort()
.forEach(root=>{

groups.push({
root:root,
type:"",
paths:rootGroups.get(root)
});

});



function createNodeMap(group){

const nodes=new Map();

group.paths.forEach(path=>{

if(path===group.root){
return;
}

if(!path.startsWith(group.root+"/")){
return;
}

const local=
path.slice(group.root.length+1);

const parts=local.split("/");

let current="";

for(let i=0;i<parts.length-1;i++){

current=current
?current+"/"+parts[i]
:parts[i];

if(!nodes.has(current)){

nodes.set(current,{
path:current,
folder:true
});

}

}

nodes.set(local,{
path:local,
folder:false
});

});

return nodes;

}



function getChildren(nodes,parent){

const result=[];

nodes.forEach(node=>{

const parts=node.path.split("/");

const parentPath=
parts.slice(0,-1).join("/");

if(parentPath===parent){

result.push(node);

}

});

result.sort((a,b)=>{

if(a.folder!==b.folder){
return a.folder?-1:1;
}

return a.path.split("/").pop()
.localeCompare(
b.path.split("/").pop()
);

});

return result;

}



function beginLongPress(event,path,isFolder){

if(event.pointerType==="mouse"&&event.button!==0){
return;
}

if(activePointers.size>1){
return;
}

clearLongPress();

longPressPointerId=event.pointerId;
longPressStarted=false;

longPressTimer=setTimeout(()=>{

if(activePointers.size!==1){
return;
}

longPressStarted=true;
dragPath=path;
dragPointerId=event.pointerId;

const target=event.currentTarget;

if(target){
target.style.opacity=".45";
}

},550);

}



function clearLongPress(){

if(longPressTimer){

clearTimeout(longPressTimer);
longPressTimer=null;

}

}



function findTreeButton(path){

const buttons=
fileTree.querySelectorAll(".tree-item");

for(const button of buttons){

if(button.dataset.path===path){
return button;
}

}

return null;

}



function isInsidePath(path,target){

return(
target===path||
target.startsWith(path+"/")
);

}



function moveEntry(path,targetFolder){

if(!zip){
return false;
}

path=normalizePath(path);
targetFolder=normalizePath(targetFolder);

if(!path||!zip.file(path)){
return false;
}

if(
targetFolder===path||
targetFolder.startsWith(path+"/")
){
return false;
}

const name=
path.split("/").pop();

const newPath=
targetFolder
?targetFolder+"/"+name
:name;

const finalPath=
uniquePath(newPath);

if(finalPath===path){
return false;
}

const entry=zip.file(path);

if(!entry){
return false;
}

return entry.async("uint8array")
.then(data=>{

zip.file(finalPath,data);
zip.remove(path);

if(selectedPath===path){

selectedPath=finalPath;

editorPath.textContent=finalPath;

}

return refreshAddonDetection();

})
.then(()=>{

renderTree();

return true;

});

}



function finishDrag(event){

clearLongPress();

if(!longPressStarted){
return;
}

const source=dragPath;

longPressStarted=false;
dragPath="";
dragPointerId=null;

const element=
document.elementFromPoint(
event.clientX,
event.clientY
);

let targetFolder="";

if(element){

const button=
element.closest(".tree-item");

if(button&&button.dataset.path){

const targetPath=
normalizePath(button.dataset.path);

if(button.dataset.folder==="true"){

targetFolder=targetPath;

}else{

targetFolder=getDirectory(targetPath);

}

}

}

const sourceButton=findTreeButton(source);

if(sourceButton){
sourceButton.style.opacity="";
}

if(targetFolder){

moveEntry(source,targetFolder)
.then(()=>{

});

}

}



function attachTreePointerEvents(button,path,isFolder){

button.dataset.path=path;
button.dataset.folder=isFolder?"true":"false";

button.addEventListener(
"pointerdown",
event=>{

activePointers.add(event.pointerId);

if(activePointers.size===1){

beginLongPress(event,path,isFolder);

}

},
{
passive:true
}
);

button.addEventListener(
"pointermove",
event=>{

if(
longPressPointerId===event.pointerId&&
longPressStarted
){

event.preventDefault();

}

},
{
passive:false
}
);

button.addEventListener(
"pointerup",
event=>{

activePointers.delete(event.pointerId);

if(
longPressPointerId===event.pointerId&&
longPressStarted
){

finishDrag(event);

}else{

clearLongPress();

}

},
{
passive:false
}
);

button.addEventListener(
"pointercancel",
event=>{

activePointers.delete(event.pointerId);

if(longPressPointerId===event.pointerId){

const sourceButton=findTreeButton(dragPath);

if(sourceButton){
sourceButton.style.opacity="";
}

}

clearLongPress();

longPressStarted=false;
dragPath="";
dragPointerId=null;

},
{
passive:false
}
);

button.addEventListener(
"contextmenu",
event=>{

event.preventDefault();

}
);

}



function renderGroup(group){

const rootButton=document.createElement("button");

rootButton.className="tree-item folder";

const rootOpen=
openFolders.has(group.root);

rootButton.innerHTML=
'<span class="tree-arrow">'+
(rootOpen?"▼":"▶")+
'</span>'+
'📁 '+
escapeHtml(
group.root.split("/").pop()
)+
(
group.type
?" ["+escapeHtml(group.type)+"]"
:""
);

fileTree.appendChild(rootButton);

attachTreePointerEvents(
rootButton,
group.root,
true
);

const nodes=
createNodeMap(group);

const rootContainer=
document.createElement("div");

rootContainer.dataset.treeContainer=group.root;

if(!rootOpen){

rootContainer.classList.add("tree-hidden");

}

fileTree.appendChild(rootContainer);



rootButton.onclick=()=>{

if(longPressStarted){
return;
}

if(openFolders.has(group.root)){

openFolders.delete(group.root);

}else{

openFolders.add(group.root);

}

renderTree();

};



function renderNode(node,depth,parentContainer){

const fullPath=
group.root+"/"+node.path;

const open=
openFolders.has(fullPath);

const button=document.createElement("button");

button.className="tree-item";

if(node.folder){

button.classList.add("folder");

}else{

button.classList.add("file");

}



if(depth===1){
button.classList.add("tree-indent-1");
}
else if(depth===2){
button.classList.add("tree-indent-2");
}
else if(depth===3){
button.classList.add("tree-indent-3");
}
else if(depth===4){
button.classList.add("tree-indent-4");
}
else if(depth>=5){
button.classList.add("tree-indent-5");
}



const name=
node.path.split("/").pop();



if(node.folder){

button.innerHTML=
'<span class="tree-arrow">'+
(open?"▼":"▶")+
'</span>'+
'📁 '+
escapeHtml(name);

}else{

button.innerHTML=
'<span class="tree-arrow"></span>'+
getIcon(fullPath)+" "+
escapeHtml(name);

}



parentContainer.appendChild(button);

attachTreePointerEvents(
button,
fullPath,
node.folder
);



if(node.folder){

const childContainer=
document.createElement("div");

if(!open){

childContainer.classList.add("tree-hidden");

}

parentContainer.appendChild(childContainer);



button.onclick=()=>{

if(longPressStarted){
return;
}

if(openFolders.has(fullPath)){

openFolders.delete(fullPath);

}else{

openFolders.add(fullPath);

}

renderTree();

};



getChildren(nodes,node.path)
.forEach(child=>{

renderNode(
child,
depth+1,
childContainer
);

});

}else{

button.onclick=()=>{

if(longPressStarted){
return;
}

openFile(fullPath);

};

}

}



getChildren(nodes,"")
.forEach(node=>{

renderNode(
node,
1,
rootContainer
);

});

}



groups.forEach(group=>{

renderGroup(group);

});



if(!groups.length){

fileTree.innerHTML=
'<div class="editor-empty">表示できるファイルがありません</div>';

}

}

function renameSelected(){

if(!zip||!selectedPath){
return;
}

const oldPath=selectedPath;

const oldName=
oldPath.split("/").pop();

const newName=
prompt(
"新しいファイル名を入力してください",
oldName
);

if(!newName){
return;
}

if(
newName.includes("/")||
newName.includes("\\")
){

alert("ファイル名に / や \\ は使用できません。");

return;

}

const directory=
getDirectory(oldPath);

const newPath=
uniquePath(
directory
?directory+"/"+newName
:newName
);

if(newPath===oldPath){
return;
}

const entry=zip.file(oldPath);

if(!entry){
return;
}

entry.async("uint8array")
.then(data=>{

zip.file(newPath,data);
zip.remove(oldPath);

selectedPath=newPath;

editorTitle.textContent=
newName;

editorPath.textContent=
newPath;

return refreshAddonDetection();

})
.then(()=>{

renderTree();

});

}

function applyImageTransform(){

const transform=
document.getElementById("imageTransform");

if(!transform){
return;
}

transform.style.transform=
"translate3d("+
imageState.x+
"px,"+
imageState.y+
"px,0)";

const img=
document.getElementById("previewImage");

if(img){

img.style.transform=
"translate(-50%,-50%) scale("+
imageState.scale+
")";

}

const zoom=
document.getElementById("zoomValue");

if(zoom){

zoom.textContent=
Math.round(imageState.scale*100)+"%";

}

}



function setupImageGestures(canvas){

let pointers=new Map();

let lastX=0;
let lastY=0;

let pinchStartDistance=0;
let pinchStartScale=1;

function distance(a,b){

return Math.hypot(
a.clientX-b.clientX,
a.clientY-b.clientY
);

}



canvas.addEventListener(
"pointerdown",
event=>{

canvas.setPointerCapture(event.pointerId);

pointers.set(
event.pointerId,
event
);

if(pointers.size===1){

lastX=event.clientX;
lastY=event.clientY;

}

if(pointers.size===2){

const values=
Array.from(pointers.values());

pinchStartDistance=
distance(
values[0],
values[1]
);

pinchStartScale=
imageState.scale;

}

event.preventDefault();

},
{
passive:false
}
);



canvas.addEventListener(
"pointermove",
event=>{

if(!pointers.has(event.pointerId)){
return;
}

pointers.set(
event.pointerId,
event
);

if(pointers.size===1){

const dx=
event.clientX-lastX;

const dy=
event.clientY-lastY;

imageState.x+=dx;
imageState.y+=dy;

lastX=event.clientX;
lastY=event.clientY;

applyImageTransform();

}

else if(pointers.size===2){

const values=
Array.from(pointers.values());

const currentDistance=
distance(
values[0],
values[1]
);

if(pinchStartDistance>0){

const ratio=
currentDistance/
pinchStartDistance;

imageState.scale=
Math.max(
0.1,
Math.min(
10,
pinchStartScale*ratio
)
);

applyImageTransform();

}

}

event.preventDefault();

},
{
passive:false
}
);



canvas.addEventListener(
"pointerup",
event=>{

pointers.delete(event.pointerId);

if(pointers.size===1){

const remaining=
Array.from(pointers.values())[0];

lastX=remaining.clientX;
lastY=remaining.clientY;

}

},
{
passive:false
}
);



canvas.addEventListener(
"pointercancel",
event=>{

pointers.delete(event.pointerId);

},
{
passive:false
}
);

}



async function openFile(path){

if(!zip){
return;
}

const entry=zip.file(path);

if(!entry){
return;
}

selectedPath=normalizePath(path);

editorTitle.textContent=
selectedPath.split("/").pop();

editorPath.textContent=selectedPath;



if(imageObjectUrl){

URL.revokeObjectURL(imageObjectUrl);

imageObjectUrl="";

}



if(isText(selectedPath)){

const text=
await entry.async("string");

selectedType="text";

const textarea=
document.createElement("textarea");

textarea.id="editorTextarea";
textarea.value=text;

editorContent.innerHTML="";
editorContent.appendChild(textarea);

saveButton.disabled=false;
fileDownloadButton.disabled=false;

return;

}



if(isImage(selectedPath)){

selectedType="image";

imageState={
scale:1,
x:0,
y:0
};

const blob=
await entry.async("blob");

imageObjectUrl=
URL.createObjectURL(blob);

editorContent.innerHTML="";

const area=
document.createElement("div");

area.className="image-area";

const toolbar=
document.createElement("div");

toolbar.className="image-toolbar";

const minus=
document.createElement("button");

minus.textContent="−";

const reset=
document.createElement("button");

reset.textContent="リセット";

const plus=
document.createElement("button");

plus.textContent="+";

const zoomValue=
document.createElement("div");

zoomValue.className="zoom-value";
zoomValue.id="zoomValue";

zoomValue.textContent="100%";

toolbar.appendChild(minus);
toolbar.appendChild(zoomValue);
toolbar.appendChild(plus);
toolbar.appendChild(reset);



const canvas=
document.createElement("div");

canvas.className="image-canvas";

const transform=
document.createElement("div");

transform.className="image-transform";
transform.id="imageTransform";

const img=
document.createElement("img");

img.id="previewImage";
img.src=imageObjectUrl;
img.alt=selectedPath;

transform.appendChild(img);
canvas.appendChild(transform);

area.appendChild(toolbar);
area.appendChild(canvas);

editorContent.appendChild(area);



minus.onclick=()=>{

imageState.scale=
Math.max(
0.1,
imageState.scale-0.1
);

applyImageTransform();

};



plus.onclick=()=>{

imageState.scale=
Math.min(
10,
imageState.scale+0.1
);

applyImageTransform();

};



reset.onclick=()=>{

imageState={
scale:1,
x:0,
y:0
};

applyImageTransform();

};



img.onload=()=>{

img.style.width=
img.naturalWidth+"px";

img.style.height=
img.naturalHeight+"px";

applyImageTransform();

};



setupImageGestures(canvas);

saveButton.disabled=true;
fileDownloadButton.disabled=false;

return;

}



selectedType="other";

saveButton.disabled=true;
fileDownloadButton.disabled=true;

editorContent.innerHTML=
'<div class="editor-empty">'+
"このファイルはプレビュー・編集に対応していません。"+
'</div>';

}

if(
!zip||
!selectedPath||
selectedType!=="text"
){
return;
}

const textarea=
document.getElementById("editorTextarea");

return;
}

textarea.value

saveButton.textContent="保存しました";

fileDownloadButton.onclick=async()=>{

if(
!zip||
!selectedPath
){
return;
}

const entry=
zip.file(selectedPath);

if(!entry){
return;
}

fileDownloadButton.disabled=true;
fileDownloadButton.textContent="生成中...";

try{

let blob;

if(selectedType==="text"){

const textarea=
document.getElementById("editorTextarea");

const value=
textarea
?textarea.value
:await entry.async("string");

zip.file(
selectedPath,
value
);

blob=
new Blob(
[value],
{
type:"text/plain;charset=utf-8"
}
);

}else{

blob=
await entry.async("blob");

}

downloadBlob(
blob,
selectedPath.split("/").pop()
);

fileDownloadButton.textContent="書き出し完了";

setTimeout(()=>{

fileDownloadButton.textContent=
"このファイルを書き出し";

fileDownloadButton.disabled=false;

},1200);

}catch(error){

fileDownloadButton.textContent=
"このファイルを書き出し";

fileDownloadButton.disabled=false;

alert(error.message);

}

};



async function createCleanZip(){

const cleanZip=
new JSZip();

const entries=[];

zip.forEach((path,entry)=>{

if(entry.dir){
return;
}

const normalized=
normalizePath(path);

if(!isAllowedFile(normalized)){
return;
}

entries.push({
path:normalized,
entry:entry
});

});



for(const item of entries){

if(
item.path===selectedPath&&
selectedType==="text"
){

const textarea=
document.getElementById("editorTextarea");

if(textarea){

cleanZip.file(
item.path,
textarea.value
);

continue;

}

}

const data=
await item.entry.async("uint8array");

cleanZip.file(
item.path,
data
);

}

return cleanZip;

}

function downloadBlob(blob,name){

const url=
URL.createObjectURL(blob);

const a=
document.createElement("a");

a.href=url;
a.download=name;

document.body.appendChild(a);

a.click();

a.remove();

setTimeout(()=>{

URL.revokeObjectURL(url);

},1000);

}
