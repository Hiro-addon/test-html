<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0,user-scalable=no">
<title>MC Pack Editor Test</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jszip/3.10.1/jszip.min.js"></script>

<style>
*{
box-sizing:border-box;
-webkit-tap-highlight-color:transparent;
}

html,body{
margin:0;
width:100%;
height:100%;
font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
background:#f4f4f6;
color:#111;
}

body{
display:flex;
flex-direction:column;
overflow:hidden;
}

header{
height:64px;
background:#fff;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
padding:0 14px;
gap:10px;
flex-shrink:0;
}

header h1{
font-size:19px;
margin:0;
font-weight:700;
}

button,
input{
font:inherit;
}

.top-buttons{
display:flex;
gap:8px;
margin-left:auto;
}

button{
border:0;
border-radius:10px;
padding:10px 13px;
background:#111;
color:#fff;
font-weight:600;
cursor:pointer;
}

button:disabled{
opacity:.35;
cursor:default;
}

#fileInput{
display:none;
}

.main{
flex:1;
display:flex;
min-height:0;
}

.sidebar{
width:360px;
background:#fff;
border-right:1px solid #ddd;
display:flex;
flex-direction:column;
min-width:260px;
}

.sidebar-title{
padding:14px;
font-size:14px;
font-weight:700;
border-bottom:1px solid #eee;
}

.tree{
flex:1;
overflow:auto;
padding:8px 0 20px;
}

.tree-row{
width:100%;
min-height:42px;
display:flex;
align-items:center;
padding:0 12px;
gap:7px;
border:0;
border-radius:0;
background:transparent;
color:#111;
text-align:left;
font-weight:400;
}

.tree-row:hover{
background:#f3f3f3;
}

.tree-row.folder{
font-weight:600;
}

.tree-arrow{
width:18px;
flex:none;
text-align:center;
font-size:12px;
}

.tree-icon{
width:22px;
flex:none;
text-align:center;
}

.tree-name{
min-width:0;
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.editor{
flex:1;
min-width:0;
display:flex;
flex-direction:column;
background:#f4f4f6;
}

.editor-header{
height:54px;
background:#fff;
border-bottom:1px solid #ddd;
display:flex;
align-items:center;
padding:0 14px;
font-size:14px;
font-weight:600;
overflow:hidden;
}

.editor-header span{
overflow:hidden;
text-overflow:ellipsis;
white-space:nowrap;
}

.editor-body{
flex:1;
min-height:0;
position:relative;
}

.empty{
height:100%;
display:flex;
align-items:center;
justify-content:center;
color:#888;
font-size:14px;
text-align:center;
padding:20px;
}

textarea{
position:absolute;
inset:0;
width:100%;
height:100%;
resize:none;
border:0;
outline:0;
padding:16px;
font-family:ui-monospace,SFMono-Regular,Menlo,monospace;
font-size:14px;
line-height:1.55;
background:#fff;
color:#111;
}

.image-editor{
position:absolute;
inset:0;
display:flex;
flex-direction:column;
background:#151515;
}

.image-toolbar{
height:54px;
background:#fff;
display:flex;
align-items:center;
justify-content:center;
gap:8px;
flex-shrink:0;
}

.image-toolbar button{
min-width:42px;
padding:8px 12px;
}

.zoom-value{
min-width:60px;
text-align:center;
font-size:13px;
font-weight:600;
color:#111;
}

.image-area{
position:relative;
flex:1;
overflow:hidden;
touch-action:none;
display:flex;
align-items:center;
justify-content:center;
}

.image-area img{
position:absolute;
max-width:none;
max-height:none;
user-select:none;
-webkit-user-drag:none;
transform-origin:center center;
touch-action:none;
}

.bottom{
height:62px;
background:#fff;
border-top:1px solid #ddd;
display:flex;
align-items:center;
gap:8px;
padding:8px 12px;
flex-shrink:0;
}

.bottom button{
flex:1;
font-size:13px;
padding:10px 7px;
}

.status{
font-size:12px;
color:#777;
padding:8px 12px;
border-top:1px solid #eee;
background:#fff;
}

@media(max-width:700px){
header{
height:58px;
}

header h1{
font-size:16px;
}

.top-buttons button{
padding:8px 9px;
font-size:12px;
}

.sidebar{
width:45%;
min-width:170px;
}

.tree-row{
padding-left:8px;
padding-right:6px;
gap:4px;
}

.tree-name{
font-size:13px;
}

.editor-header{
font-size:12px;
}

.bottom{
height:auto;
min-height:62px;
}

.bottom button{
font-size:11px;
}
}
</style>
</head>

<body>

<header>
<h1>MC Pack Editor Test</h1>

<div class="top-buttons">
<button id="openButton">開く</button>
</div>
</header>

<input
type="file"
id="fileInput"
accept=".mcaddon,.mcpack,.zip"
>

<div class="main">

<div class="sidebar">

<div class="sidebar-title">
ファイル構成
</div>

<div
id="tree"
class="tree"
>
<div class="empty">
.mcaddon / .mcpack / .zip<br>
ファイルを開いてください
</div>
</div>

<div
id="status"
class="status"
>
ファイル未選択
</div>

</div>

<div class="editor">

<div
id="editorHeader"
class="editor-header"
>
<span>ファイルを選択してください</span>
</div>

<div
id="editorBody"
class="editor-body"
>
<div class="empty">
左のファイル構成から<br>
ファイルを選択してください
</div>
</div>

<div class="bottom">

<button id="saveButton" disabled>
保存
</button>

<button id="exportFileButton" disabled>
このファイルを書き出し
</button>

<button id="mcpackButton" disabled>
MCAddon / MCPackとして書き出し
</button>

<button id="zipButton" disabled>
ZIPとして書き出し
</button>

</div>

</div>

</div>

<script>
const fileInput=document.getElementById("fileInput");
const openButton=document.getElementById("openButton");
const tree=document.getElementById("tree");
const status=document.getElementById("status");
const editorHeader=document.getElementById("editorHeader");
const editorBody=document.getElementById("editorBody");

const saveButton=document.getElementById("saveButton");
const exportFileButton=document.getElementById("exportFileButton");
const mcpackButton=document.getElementById("mcpackButton");
const zipButton=document.getElementById("zipButton");

let zip=null;
let currentFile=null;
let currentTextArea=null;
let currentImage=null;

let addonDetected=false;
let packRoots=[];

let openFolders=new Set();
let rootOpen=new Set();

let imageState={
scale:1,
x:0,
y:0
};

let pointers=new Map();
let pinchStartDistance=0;
let pinchStartScale=1;

function normalizePath(path){
return path
.replace(/\\/g,"/")
.replace(/^\/+/,"")
.replace(/\/+/g,"/");
}

function isText(path){
return /\.(json|js|mcfunction|lang|txt|md|html|css|xml|yml|yaml)$/i.test(path);
}

function isImage(path){
return /\.(png|jpg|jpeg|webp|gif)$/i.test(path);
}

function isManifest(path){
return /(^|\/)manifest\.json$/i.test(path);
}

function isAllowedFile(path){
if(!path)return false;

const lower=path.toLowerCase();

if(
lower.includes("/__macosx/")||
lower.startsWith("__macosx/")||
lower.endsWith("/.ds_store")||
lower===".ds_store"||
lower.endsWith("/thumbs.db")||
lower==="thumbs.db"||
lower.endsWith(".bak")||
lower.endsWith(".tmp")||
lower.endsWith(".log")
){
return false;
}

return isText(path)||isImage(path);
}

async function detectMinecraftAddon(z){
const manifests=[];

for(const name of Object.keys(z.files)){
const path=normalizePath(name);

if(
z.files[name].dir||
!isManifest(path)
){
continue;
}

try{
const text=await z.files[name].async("text");
const data=JSON.parse(text);

if(
data &&
typeof data==="object" &&
data.header &&
typeof data.header==="object" &&
Array.isArray(data.modules)
){
const modules=data.modules.map(m=>{
if(m&&typeof m==="object"){
return String(m.type||"").toLowerCase();
}
return "";
});

const hasResources=modules.includes("resources");
const hasData=modules.includes("data");

if(
data.header.name||
data.header.uuid||
hasResources||
hasData
){
manifests.push({
path,
data,
hasResources,
hasData
});
}
}
}catch(e){}
}

return manifests;
}

function getPackRoot(manifestPath){
const parts=normalizePath(manifestPath).split("/");

parts.pop();

return parts.join("/");
}

function sortPackRoots(roots){
return [...new Set(
roots
.filter(v=>v!==undefined)
.map(normalizePath)
)].sort((a,b)=>{
const ad=a.split("/").length;
const bd=b.split("/").length;

if(ad!==bd)return ad-bd;

return a.localeCompare(b);
});
}

function getDisplayRoot(path){
const p=normalizePath(path);

for(const root of packRoots){
if(
p===root||
p.startsWith(root+"/")
){
return root;
}
}

const parts=p.split("/");
return parts.length>1?parts[0]:p;
}

function getRelativeToRoot(path,root){
const p=normalizePath(path);

if(p===root){
return "";
}

if(p.startsWith(root+"/")){
return p.slice(root.length+1);
}

return p;
}

function getIcon(path,isFolder=false){
if(isFolder)return "📁";

const lower=path.toLowerCase();

if(lower.endsWith(".json"))return "📄";
if(lower.endsWith(".js"))return "📜";
if(lower.endsWith(".mcfunction"))return "⚙️";
if(lower.endsWith(".lang"))return "🌐";
if(lower.endsWith(".png")||
lower.endsWith(".jpg")||
lower.endsWith(".jpeg")||
lower.endsWith(".webp")||
lower.endsWith(".gif"))return "🖼️";
if(lower.endsWith(".html"))return "🌐";
if(lower.endsWith(".css"))return "🎨";

return "📄";
}

function makeTreeStructure(root){
const structure={
folders:new Map(),
files:[]
};

for(const name of Object.keys(zip.files)){
const path=normalizePath(name);

if(
zip.files[name].dir||
!isAllowedFile(path)
){
continue;
}

const relative=getRelativeToRoot(path,root);

if(relative==="")continue;

const parts=relative.split("/").filter(Boolean);

if(parts.length===1){
structure.files.push({
path,
name:parts[0]
});
continue;
}

let current=structure;

for(let i=0;i<parts.length-1;i++){
const part=parts[i];

if(!current.folders.has(part)){
current.folders.set(part,{
name:part,
path:root+"/"+parts.slice(0,i+1).join("/"),
folders:new Map(),
files:[]
});
}

current=current.folders.get(part);
}

current.files.push({
path,
name:parts[parts.length-1]
});
}

return structure;
}

function createFolderButton(folder,depth){
const button=document.createElement("button");

button.className="tree-row folder";

button.style.paddingLeft=(12+depth*20)+"px";

const opened=openFolders.has(folder.path);

button.innerHTML=
'<span class="tree-arrow">'+
(opened?"▼":"▶")+
'</span>'+
'<span class="tree-icon">📁</span>'+
'<span class="tree-name">'+
escapeHtml(folder.name)+
'</span>';

button.addEventListener("click",()=>{
if(openFolders.has(folder.path)){
openFolders.delete(folder.path);
}else{
openFolders.add(folder.path);
}

renderTree();
});

return button;
}

function createFileButton(file,depth){
const button=document.createElement("button");

button.className="tree-row";

button.style.paddingLeft=(12+depth*20)+"px";

button.innerHTML=
'<span class="tree-arrow"></span>'+
'<span class="tree-icon">'+
getIcon(file.path)+
'</span>'+
'<span class="tree-name">'+
escapeHtml(file.name)+
'</span>';

button.addEventListener("click",()=>{
openFile(file.path);
});

return button;
}

function renderFolder(folder,depth){
const fragment=document.createDocumentFragment();

fragment.appendChild(
createFolderButton(folder,depth)
);

if(!openFolders.has(folder.path)){
return fragment;
}

const folders=[...folder.folders.values()]
.sort((a,b)=>a.name.localeCompare(b.name));

for(const child of folders){
fragment.appendChild(
renderFolder(child,depth+1)
);
}

const files=[...folder.files]
.sort((a,b)=>a.name.localeCompare(b.name));

for(const file of files){
fragment.appendChild(
createFileButton(file,depth+1)
);
}

return fragment;
}

function renderTree(){
tree.innerHTML="";

if(!zip){
tree.innerHTML=
'<div class="empty">'+
'.mcaddon / .mcpack / .zip<br>'+
'ファイルを開いてください'+
'</div>';
return;
}

const roots=new Set();

for(const name of Object.keys(zip.files)){
const path=normalizePath(name);

if(
zip.files[name].dir||
!isAllowedFile(path)
){
continue;
}

roots.add(getDisplayRoot(path));
}

const orderedRoots=[...roots].sort((a,b)=>{
const ap=packRoots.includes(a);
const bp=packRoots.includes(b);

if(ap&&!bp)return -1;
if(!ap&&bp)return 1;

return a.localeCompare(b);
});

for(const root of orderedRoots){

const rootButton=document.createElement("button");

rootButton.className="tree-row folder";

rootButton.style.paddingLeft="12px";

const opened=rootOpen.has(root);

rootButton.innerHTML=
'<span class="tree-arrow">'+
(opened?"▼":"▶")+
'</span>'+
'<span class="tree-icon">📁</span>'+
'<span class="tree-name">'+
escapeHtml(
root.split("/").filter(Boolean).pop()||root
)+
'</span>';

rootButton.addEventListener("click",()=>{
if(rootOpen.has(root)){
rootOpen.delete(root);
}else{
rootOpen.add(root);
}

renderTree();
});

tree.appendChild(rootButton);

if(!opened)continue;

const structure=makeTreeStructure(root);

const folders=[...structure.folders.values()]
.sort((a,b)=>a.name.localeCompare(b.name));

for(const folder of folders){
tree.appendChild(
renderFolder(folder,1)
);
}

const files=[...structure.files]
.sort((a,b)=>a.name.localeCompare(b.name));

/*
RP / BP の直下ファイルは
必ず1段右に表示する。
rootButton が0段目なので、
depth=1 を指定する。
*/
for(const file of files){
tree.appendChild(
createFileButton(file,1)
);
}
}

}

function escapeHtml(value){
return String(value)
.replace(/&/g,"&amp;")
.replace(/</g,"&lt;")
.replace(/>/g,"&gt;")
.replace(/"/g,"&quot;")
.replace(/'/g,"&#039;");
}

async function openFile(path){
if(!zip||!zip.files[path])return;

currentFile=path;
currentTextArea=null;
currentImage=null;

editorHeader.innerHTML=
"<span>"+escapeHtml(path)+"</span>";

editorBody.innerHTML="";

if(isText(path)){
const text=await zip.files[path].async("text");

const textarea=document.createElement("textarea");

textarea.value=text;

editorBody.appendChild(textarea);

currentTextArea=textarea;

saveButton.disabled=false;
exportFileButton.disabled=false;

return;
}

if(isImage(path)){
const blob=await zip.files[path].async("blob");
const url=URL.createObjectURL(blob);

imageState={
scale:1,
x:0,
y:0
};

const wrapper=document.createElement("div");
wrapper.className="image-editor";

const toolbar=document.createElement("div");
toolbar.className="image-toolbar";

const minus=document.createElement("button");
minus.textContent="−";

const zoom=document.createElement("div");
zoom.className="zoom-value";

const plus=document.createElement("button");
plus.textContent="+";

const reset=document.createElement("button");
reset.textContent="リセット";

toolbar.appendChild(minus);
toolbar.appendChild(zoom);
toolbar.appendChild(plus);
toolbar.appendChild(reset);

const area=document.createElement("div");
area.className="image-area";

const img=document.createElement("img");
img.src=url;

area.appendChild(img);

wrapper.appendChild(toolbar);
wrapper.appendChild(area);

editorBody.appendChild(wrapper);

currentImage=img;

function updateZoom(){
zoom.textContent=
Math.round(imageState.scale*100)+"%";
}

function applyImageTransform(){
if(!currentImage)return;

currentImage.style.transform=
"translate("+imageState.x+"px,"+
imageState.y+"px) "+
"scale("+imageState.scale+")";

updateZoom();
}

minus.addEventListener("click",()=>{
imageState.scale=Math.max(
0.1,
imageState.scale/1.2
);

applyImageTransform();
});

plus.addEventListener("click",()=>{
imageState.scale=Math.min(
20,
imageState.scale*1.2
);

applyImageTransform();
});

reset.addEventListener("click",()=>{
imageState={
scale:1,
x:0,
y:0
};

applyImageTransform();
});

setupImageGestures(area);

applyImageTransform();

saveButton.disabled=true;
exportFileButton.disabled=false;

return;
}

saveButton.disabled=true;
exportFileButton.disabled=true;

editorBody.innerHTML=
'<div class="empty">このファイルはプレビューできません</div>';
}

function setupImageGestures(area){
pointers.clear();

let lastX=0;
let lastY=0;

area.addEventListener("pointerdown",e=>{
area.setPointerCapture(e.pointerId);

pointers.set(e.pointerId,{
x:e.clientX,
y:e.clientY
});

if(pointers.size===1){
lastX=e.clientX;
lastY=e.clientY;
}

if(pointers.size===2){
const pts=[...pointers.values()];

pinchStartDistance=Math.hypot(
pts[0].x-pts[1].x,
pts[0].y-pts[1].y
);

pinchStartScale=imageState.scale;
}
});

area.addEventListener("pointermove",e=>{
if(!pointers.has(e.pointerId))return;

pointers.set(e.pointerId,{
x:e.clientX,
y:e.clientY
});

if(pointers.size===1){
const dx=e.clientX-lastX;
const dy=e.clientY-lastY;

imageState.x+=dx;
imageState.y+=dy;

lastX=e.clientX;
lastY=e.clientY;

applyImageTransform();
return;
}

if(pointers.size===2){
const pts=[...pointers.values()];

const distance=Math.hypot(
pts[0].x-pts[1].x,
pts[0].y-pts[1].y
);

if(pinchStartDistance>0){
const ratio=
distance/pinchStartDistance;

imageState.scale=Math.min(
20,
Math.max(
0.1,
pinchStartScale*ratio
)
);

applyImageTransform();
}
}
});

function removePointer(e){
pointers.delete(e.pointerId);

if(pointers.size===1){
const p=[...pointers.values()][0];

lastX=p.x;
lastY=p.y;
}
}

area.addEventListener("pointerup",removePointer);
area.addEventListener("pointercancel",removePointer);
area.addEventListener("pointerleave",removePointer);
}

saveButton.addEventListener("click",async()=>{
if(
!zip||
!currentFile||
!currentTextArea
){
return;
}

zip.file(
currentFile,
currentTextArea.value
);

status.textContent="保存しました";

renderTree();
});

exportFileButton.addEventListener("click",async()=>{
if(!zip||!currentFile)return;

let blob;

if(currentTextArea){
blob=new Blob(
[currentTextArea.value],
{
type:"text/plain;charset=utf-8"
}
);
}else{
blob=await zip.files[currentFile].async("blob");
}

downloadBlob(
blob,
currentFile.split("/").pop()
);
});

function createCleanZip(){
const output=new JSZip();

for(const name of Object.keys(zip.files)){
const path=normalizePath(name);

if(
zip.files[name].dir||
!isAllowedFile(path)
){
continue;
}

if(
currentFile===path&&
currentTextArea
){
output.file(
path,
currentTextArea.value
);
}else{
output.file(
path,
zip.files[name].async("uint8array")
);
}
}

return output;
}

mcpackButton.addEventListener("click",async()=>{
if(!zip||!addonDetected)return;

const output=createCleanZip();

const blob=await output.generateAsync({
type:"blob"
});

const extension=
packRoots.length>1?
"mcaddon":
"mcpack";

downloadBlob(
blob,
"edited_addon."+extension
);
});

zipButton.addEventListener("click",async()=>{
if(!zip)return;

const output=createCleanZip();

const blob=await output.generateAsync({
type:"blob"
});

downloadBlob(
blob,
"edited_files.zip"
);
});

function downloadBlob(blob,name){
const url=URL.createObjectURL(blob);

const a=document.createElement("a");

a.href=url;
a.download=name;

document.body.appendChild(a);
a.click();
a.remove();

setTimeout(()=>{
URL.revokeObjectURL(url);
},1000);
}

openButton.addEventListener("click",()=>{
fileInput.click();
});

fileInput.addEventListener("change",async()=>{
const file=fileInput.files[0];

if(!file)return;

try{

status.textContent="読み込み中...";

const buffer=await file.arrayBuffer();

zip=await JSZip.loadAsync(buffer);

const manifests=
await detectMinecraftAddon(zip);

packRoots=sortPackRoots(
manifests.map(m=>getPackRoot(m.path))
);

addonDetected=
manifests.length>0;

openFolders.clear();
rootOpen.clear();

for(const root of packRoots){
rootOpen.add(root);
}

currentFile=null;
currentTextArea=null;
currentImage=null;

editorHeader.innerHTML=
"<span>ファイルを選択してください</span>";

editorBody.innerHTML=
'<div class="empty">'+
'左のファイル構成から<br>'+
'ファイルを選択してください'+
'</div>';

saveButton.disabled=true;
exportFileButton.disabled=true;

mcpackButton.disabled=!addonDetected;
zipButton.disabled=false;

renderTree();

status.textContent=
file.name+" を読み込みました";

}catch(e){

zip=null;
addonDetected=false;
packRoots=[];

tree.innerHTML=
'<div class="empty">読み込みに失敗しました</div>';

editorHeader.innerHTML=
"<span>読み込み失敗</span>";

editorBody.innerHTML=
'<div class="empty">'+
escapeHtml(e.message||"不明なエラー")+
'</div>';

saveButton.disabled=true;
